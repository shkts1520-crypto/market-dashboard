name: Research MC57 NQSAR Recovery

on:
  push:
    branches:
      - research/mc57-nqsar-recovery-20260912
    paths:
      - research/mc57_nqsar_shadow.py
      - research/mc57_golden_check.py
      - .github/workflows/research-mc57-nqsar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas numpy yfinance==0.2.66

      - name: Run research shadow
        run: |
          set -euo pipefail
          python research/mc57_nqsar_shadow.py | tee research_shadow.log

      - name: Run MC57 golden reproduction
        run: |
          set -euo pipefail
          python research/mc57_golden_check.py | tee mc57_golden.log

      - name: Assert research outputs exist
        run: |
          set -euo pipefail
          test -s research_out/mc57_nqsar_shadow.json
          test -s research_out/mc57_candidate57_tail.csv
          test -s research_out/nqsar_shadow_tail.csv
          test -s research_out/mc57_golden_20260828.json
          python -m json.tool research_out/mc57_nqsar_shadow.json >/dev/null
          python -m json.tool research_out/mc57_golden_20260828.json >/dev/null

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc57-nqsar-recovery-shadow
          path: |
            research_out/
            research_shadow.log
            mc57_golden.log
          if-no-files-found: error
          retention-days: 14
