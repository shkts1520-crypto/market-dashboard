name: V38 Production Full Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 22 * * 1-5'
    - cron: '17 4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v38-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification and acquisition dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest playwright==1.55.0 'yfinance==0.2.66'

      - name: Run full Python and JavaScript suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Collected tests: $COUNT"
          if [ "$COUNT" -lt "200" ]; then
            echo "::error::Expected at least 200 tests, got $COUNT"
            exit 1
          fi
          python -m compileall -q src scripts
          node --check assets/v38-runtime.js
          node --check assets/v38-site.js
          node --check assets/v38-observables.js
          node --check assets/v38-rs.js

      - name: Revalidate retained session or select live acquisition
        id: session-mode
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(PYTHONPATH=src python scripts/select_session_mode.py --data-dir data)"
          case "$MODE" in
            acquire|retain) ;;
            *) echo "::error::Unexpected session mode: $MODE"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Session mode: $MODE"

      - name: Fetch and calculate current V38 session
        if: github.event_name != 'pull_request' && steps.session-mode.outputs.mode == 'acquire'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v38-live"
          mkdir -p "$RUNNER_TEMP/v38-live"
          PYTHONPATH=src python scripts/fetch_live_data.py \
            --data-dir data \
            --work-dir "$RUNNER_TEMP/v38-live"

      - name: Calculate RS history and leadership persistence
        if: github.event_name != 'pull_request' && steps.session-mode.outputs.mode == 'acquire'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/v38-live/ohlcv.csv"
          test -s data/rs.json
          PYTHONPATH=src python scripts/calculate_rs_history.py \
            --ohlcv "$RUNNER_TEMP/v38-live/ohlcv.csv" \
            --rs data/rs.json \
            --output data/rs_history.json

      - name: Calculate fixed-57 MC57
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/calculate_mc57_live.py \
            --data-dir data \
            --reference config/mc57_reference.json \
            --golden-fixture tests/fixtures/mc57_recovery_golden_20260909_11.json

      - name: Recover remaining non-options live inputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/materialize_recovered_live_inputs.py --data-dir data

      - name: Calculate live options positioning
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/calculate_options_live.py --data-dir data --target-limit 24

      - name: Materialize current supplemental shards
        shell: bash
        run: |
          set -euo pipefail
          test -s data/state.json
          PYTHONPATH=src python scripts/materialize_supplemental.py --data-dir data
          SESSION="$(python - <<'PY'
          import json
          print(json.load(open('data/state.json', encoding='utf-8'))['session_date'])
          PY
          )"
          PYTHONPATH=src python - <<PY
          from v38.market_status import normalize_market_statuses
          normalize_market_statuses('data', session_date='${SESSION}')
          PY

      - name: Validate live reconstructed inputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          import math
          from pathlib import Path
          from v38.mc57_live import FIXED_57_ETFS, load_verified_reference

          root = Path('data')
          state = json.loads((root / 'state.json').read_text(encoding='utf-8'))
          session = state['session_date']

          mc57 = json.loads((root / 'mc57.json').read_text(encoding='utf-8'))
          ref = load_verified_reference(
              'config/mc57_reference.json',
              'tests/fixtures/mc57_recovery_golden_20260909_11.json',
          )
          assert mc57.get('session_date') == session
          assert mc57.get('status') == 'READY'
          assert mc57.get('etf_universe') == list(FIXED_57_ETFS)
          assert mc57.get('coverage') == 1.0
          assert mc57.get('coverage_detail', {}).get('current_close_count') == 57
          assert mc57.get('reference', {}).get('golden_fixture_sha256') == ref.get('golden_fixture_sha256')
          for key in ('mc57', 'raw', 'ema2_raw', 'mu_prior', 'sigma_prior', 'z'):
              value = mc57.get(key)
              assert isinstance(value, (int, float)) and math.isfinite(float(value)), (key, value)
          assert len(mc57.get('metric_scores', {})) == 12

          rs_history = json.loads((root / 'rs_history.json').read_text(encoding='utf-8'))
          assert rs_history.get('session_date') == session
          assert rs_history.get('status') == 'READY', rs_history.get('reason')
          assert rs_history.get('identity_check', {}).get('mismatch_count') == 0
          assert rs_history.get('identity_check', {}).get('compared_values', 0) > 0
          assert len((rs_history.get('persistence') or {}).get('rows') or []) == 24
          comparisons = rs_history.get('comparison') or {}
          assert set(comparisons) == {'63', '126', '189'}
          assert all(len((comparisons[key] or {}).get('windows') or []) == 3 for key in comparisons)

          nqsar = json.loads((root / 'nqsar.json').read_text(encoding='utf-8'))
          assert nqsar.get('session_date') == session
          assert nqsar.get('state') in {'Blue', 'Green', 'Yellow', 'Red'}
          assert nqsar.get('input_kind') in {'state', 'EXP_STATE_ID', 'RECOVERED_YAHOO_FSM_ESTIMATE'}

          classifications = json.loads((root / 'classifications.json').read_text(encoding='utf-8'))
          themes = json.loads((root / 'theme_scores.json').read_text(encoding='utf-8'))
          core = json.loads((root / 'core12.json').read_text(encoding='utf-8'))
          assert classifications.get('session_date') == session and classifications.get('status') == 'READY'
          assert themes.get('session_date') == session and themes.get('status') == 'READY'
          assert len(classifications.get('rows') or []) > 0
          assert len(themes.get('rows') or []) > 0
          assert core.get('session_date') == session
          assert core.get('ranking_status') == 'OK', core.get('ranking_reason')

          options = json.loads((root / 'options' / 'index.json').read_text(encoding='utf-8'))
          assert options.get('session_date') == session
          assert options.get('status') in {'READY', 'DATA_REQUIRED'}
          if options.get('status') == 'READY':
              assert float(options.get('coverage') or 0.0) >= 0.25
              assert len(options.get('rows') or []) >= 3
              assert all(row.get('direction') is None for row in options.get('rows') or [])
              assert all(row.get('confidence') is None for row in options.get('rows') or [])
          print(json.dumps({
              'session_date': session,
              'mc57': mc57['mc57'],
              'rs_history_sessions': rs_history.get('history_sessions'),
              'rs_history_compared_values': rs_history.get('identity_check', {}).get('compared_values'),
              'rs_persistence_rows': len((rs_history.get('persistence') or {}).get('rows') or []),
              'nqsar': nqsar['state'],
              'nqsar_input_kind': nqsar.get('input_kind'),
              'classifications': len(classifications.get('rows') or []),
              'theme_rows': len(themes.get('rows') or []),
              'core12_rows': len(core.get('ranking') or []),
              'options_status': options.get('status'),
              'options_coverage': options.get('coverage'),
              'options_rows': len(options.get('rows') or []),
          }, sort_keys=True))
          PY

      - name: Validate single-session publication contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from v38.freshness import assess_shard_file

          root = Path('data')
          state = json.loads((root / 'state.json').read_text(encoding='utf-8'))
          session = state['session_date']
          required = (
              'rs.json', 'breadth.json', 'f123.json', 'market_inputs.json',
              'market_state.json', 'core12.json', 'mc57.json', 'positions.json',
              'rotation.json', 'weekly.json', 'options/index.json', 'publish.json',
              'rules.json',
          )
          for name in required:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
              obj = json.loads(path.read_text(encoding='utf-8'))
              assert obj.get('session_date') == session, (name, obj.get('session_date'), session)
              for key in ('generated_at', 'source', 'schema_version', 'calculation_version'):
                  assert obj.get(key), (name, key)
              assessed = assess_shard_file(path, name=name, target_session=session)
              assert assessed['status'] in {'READY', 'DATA_REQUIRED'}, (name, assessed)

          rs = json.loads((root / 'rs.json').read_text(encoding='utf-8'))
          assert int(rs['coverage_detail']['active_universe']) > 0
          assert int(rs['coverage_detail']['current_valid_ohlcv']) > 0
          assert float(rs['coverage']) >= 0.80

          publish = json.loads((root / 'publish.json').read_text(encoding='utf-8'))
          assert isinstance(publish.get('full_v38_ready'), bool)
          assert isinstance(publish.get('blockers'), list)
          print(json.dumps({
              'session_date': session,
              'stock_coverage': rs['coverage'],
              'full_v38_ready': publish['full_v38_ready'],
              'blocker_count': len(publish['blockers']),
          }, sort_keys=True))
          PY

      - name: Build production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/data/options

          PYTHONPATH=src python scripts/build_site.py \
            --canonical V38_Command_Center_mock_v5.html \
            --output _site/index.html

          cp assets/v38-runtime.js _site/assets/v38-runtime.js
          cp assets/v38-site.js _site/assets/v38-site.js
          cp assets/v38-observables.js _site/assets/v38-observables.js
          cp assets/v38-rs.js _site/assets/v38-rs.js
          cp data/options/index.json _site/data/options/index.json
          if [ -s data/rs_history.json ]; then
            cp data/rs_history.json _site/data/rs_history.json
          fi

          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=src python scripts/build_ui_payload.py \
            --data-dir data \
            --output _site/data/ui_payload.json \
            --generated-at "$GENERATED_AT"

          PYTHONPATH=src python scripts/build_ui_view_model.py \
            --data-dir data \
            --output _site/data/ui_view_model.json

          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/data/ui_payload.json
          test -s _site/data/ui_view_model.json
          test -s _site/data/options/index.json
          test -s _site/assets/v38-observables.js
          test -s _site/assets/v38-rs.js
          grep -q 'data-v38-production="live-binding"' _site/index.html
          for key in daily positions core12 rotation rs weekly options publish rules; do
            grep -q "\"${key}\"" _site/data/ui_view_model.json
          done

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Browser acceptance 375 390 430 all nine tabs
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --directory _site > "$RUNNER_TEMP/v38-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python scripts/browser_acceptance.py --url http://127.0.0.1:8000/

      - name: Commit scheduled or manually acquired data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache src/*.egg-info *.egg-info

          git add -- \
            data/rs.json \
            data/breadth.json \
            data/f123.json \
            data/market_inputs.json \
            data/state.json \
            data/acquisition_manifest.json \
            data/market_state.json \
            data/core12.json \
            data/mc57.json \
            data/positions.json \
            data/rotation.json \
            data/weekly.json \
            data/options/index.json \
            data/publish.json \
            data/rules.json

          git add -- data/history

          for path in data/nqsar.json data/theme_scores.json data/classifications.json data/positions_ledger.json data/old_top24.json data/analytics.json data/rs_history.json; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done

          if git diff --cached --quiet; then
            echo 'No production data changes to commit.'
          else
            SESSION="$(python - <<'PY'
          import json
          print(json.load(open('data/state.json', encoding='utf-8'))['session_date'])
          PY
            )"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update V38 production data ${SESSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: verify-build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
