name: Rotation Japanese Cleanup

on:
  push:
    branches:
      - fix/rotation-japanese-source-20260916

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-japanese-source-20260916
          fetch-depth: 1
      - name: Remove remaining English-first Rotation labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/v38-canonical-binder.js')
          s=p.read_text(encoding='utf-8')
          reps={
            "{label:'Ticker',key:'ticker',ticker:true,align:'left'}":"{label:'銘柄',key:'ticker',ticker:true,align:'left'}",
            "{label:'1M',format:(r)=>pct(r.ret20_avg)}":"{label:'1カ月',format:(r)=>pct(r.ret20_avg)}",
            "{label:'Theme RS',format:(r)=>num(r.theme_rs,1)}":"{label:'テーマRS',format:(r)=>num(r.theme_rs,1)}",
            "{label:'#',key:'rank'}":"{label:'順位',key:'rank'}",
            "'指数（時価総額加重）と中身（等加重・Breadth）の差を見る。上位数銘柄だけで指数が持ち上がっていないかを確認。'":"'指数（時価総額加重）と中身（等加重・広がり）の差を見る。上位数銘柄だけで指数が持ち上がっていないかを確認。'",
            "'現行Theme診断を日本語主体で表示。元ネタのテーマETF RRGとは別物なので混同しない。'":"'現行テーマ診断を日本語主体で表示。元ネタのテーマETF RRGとは別物なので混同しない。'",
          }
          for a,b in reps.items():
              assert a in s, a
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/browser_data_completeness.py')
          s=p.read_text(encoding='utf-8')
          anchor="    breadth = page.locator('#t-rotation .card[data-v38-generated=\"breadth-quality\"]')\n    assert breadth.count() == 1 and breadth.get_attribute('data-v38-status') == 'READY', (width, 'breadth-quality diagnosis missing')"
          repl=anchor+"\n    headers = page.locator('#t-rotation .v38-source-table th').all_inner_texts()\n    for banned in ('Group', 'Breadth50', 'Members', 'Ticker', 'Theme', '1D', '1W', '1M'):\n        assert banned not in headers, (width, 'Rotation table header regressed to English-first', banned, headers)\n    for required in ('セクター', '1カ月', '50日線上', '銘柄数', '銘柄', '業種', 'テーマRS', '業種RS63', '順位', '日', '週', '月', 'サブテーマ', '主導株'):\n        assert required in headers, (width, 'Japanese Rotation table header missing', required, headers)"
          assert anchor in s
          s=s.replace(anchor,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/v38-canonical-binder.js
          python -m py_compile scripts/browser_data_completeness.py
          git diff --check
      - name: Commit cleanup and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_rotation_ja_cleanup.yml
          git add assets/v38-canonical-binder.js scripts/browser_data_completeness.py
          git commit -m 'Finish Japanese Rotation labels and contracts'
          git push origin HEAD:fix/rotation-japanese-source-20260916
