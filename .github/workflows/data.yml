name: V38 Live Data Acquisition

on:
  push:
    branches:
      - main
    paths:
      - 'src/v38/live_acquisition.py'
      - 'scripts/fetch_live_data.py'
      - '.github/workflows/data.yml'
  schedule:
    - cron: '17 22 * * 1-5'
    - cron: '17 4 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v38-live-data-main
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install acquisition dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest 'yfinance==0.2.66'

      - name: Verify full suite before network acquisition
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Collected tests: $COUNT"
          if [ "$COUNT" != "189" ]; then
            echo "::error::Expected exactly 189 tests, got $COUNT"
            exit 1
          fi
          python -m compileall -q src scripts
          node --check assets/v38-runtime.js
          node --check assets/v38-site.js

      - name: Acquire current V38 data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v38-live"
          mkdir -p "$RUNNER_TEMP/v38-live"
          PYTHONPATH=src python scripts/fetch_live_data.py \
            --data-dir data \
            --work-dir "$RUNNER_TEMP/v38-live"

      - name: Validate acquired publication contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data')
          required = (
              'rs.json',
              'breadth.json',
              'f123.json',
              'market_inputs.json',
              'state.json',
              'acquisition_manifest.json',
          )
          objs = {}
          for name in required:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
              obj = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(obj, dict), name
              objs[name] = obj

          session = objs['state.json']['session_date']
          assert isinstance(session, str) and len(session) == 10
          for name, obj in objs.items():
              assert obj.get('session_date') == session, (name, obj.get('session_date'), session)
              assert obj.get('generated_at'), name
              assert obj.get('source'), name
              assert obj.get('schema_version'), name
              assert obj.get('calculation_version'), name

          rs = objs['rs.json']
          active = int(rs['coverage_detail']['active_universe'])
          current = int(rs['coverage_detail']['current_valid_ohlcv'])
          coverage = float(rs['coverage'])
          assert active > 0
          assert current > 0
          assert coverage >= 0.80

          manifest = objs['acquisition_manifest.json']
          assert manifest['universe']['biotech_heuristic_applied'] is False
          assert manifest['mc57_status'] == 'DATA_REQUIRED'
          assert manifest['structural_clinical_biotech_status'] == 'DATA_REQUIRED'
          assert manifest['peer_theme_status'] == 'DATA_REQUIRED'
          assert manifest['options_status'] == 'DATA_REQUIRED'
          assert manifest['positions_status'] == 'DATA_REQUIRED'

          market = objs['market_inputs.json']
          assert market['qqq_4h_status'] == 'DATA_REQUIRED'
          assert market['qqq_4h_reason'] == 'STAGE56_4H_FIXTURE_NOT_AVAILABLE'

          nq = root / 'nqsar.json'
          if nq.exists():
              nobj = json.loads(nq.read_text(encoding='utf-8'))
              assert nobj.get('session_date') == session

          print(json.dumps({
              'session_date': session,
              'active_universe': active,
              'current_valid_ohlcv': current,
              'coverage': coverage,
              'breadth50': objs['breadth.json'].get('breadth50'),
              'breadth200': objs['breadth.json'].get('breadth200'),
              'nqsar_status': manifest.get('nqsar_status'),
          }, sort_keys=True))
          PY

      - name: Guard generated files
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache src/*.egg-info *.egg-info

          CHANGED="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo 'No data changes.'
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              data/rs.json|data/breadth.json|data/f123.json|data/market_inputs.json|data/state.json|data/acquisition_manifest.json|data/nqsar.json)
                ;;
              *)
                echo "::error::Unexpected changed file from acquisition: $path"
                exit 1
                ;;
            esac
          done <<< "$CHANGED"

      - name: Commit acquired data
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache src/*.egg-info *.egg-info

          git add -- \
            data/rs.json \
            data/breadth.json \
            data/f123.json \
            data/market_inputs.json \
            data/state.json \
            data/acquisition_manifest.json

          if [ -f data/nqsar.json ]; then
            git add -- data/nqsar.json
          fi

          if git diff --cached --quiet; then
            echo 'No acquired data changes to commit.'
            exit 0
          fi

          SESSION="$(python - <<'PY'
          import json
          print(json.load(open('data/state.json', encoding='utf-8'))['session_date'])
          PY
          )"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update V38 live data ${SESSION}"
          git push origin HEAD:main
