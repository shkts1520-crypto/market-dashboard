name: Rotation Source Structure Patch 2

on:
  push:
    branches:
      - fix/rotation-japanese-source-20260916

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rotation-source-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-japanese-source-20260916
          fetch-depth: 1
      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_rotation_source_patch.py
          node --check assets/v38-canonical-binder.js
          python -m py_compile scripts/browser_data_completeness.py
          git diff --check
      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/_tmp_rotation_source_patch.py .github/workflows/_rotation_source_structure_patch.yml .github/workflows/_rotation_source_structure_patch2.yml
          git add assets/v38-canonical-binder.js scripts/browser_data_completeness.py
          git commit -m 'Restore Japanese source structure for Rotation diagnostics [rotation-source-done]'
          git push origin HEAD:fix/rotation-japanese-source-20260916
