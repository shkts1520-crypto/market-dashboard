name: Retire Root Pages Now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-root-pages-now.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preserved source page artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-artifact /tmp/site
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10541501242/zip" > /tmp/pages.zip
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          tar -xf /tmp/pages-artifact/artifact.tar -C /tmp/site

      - name: Remove root page only
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/site/source-mc57.html
          rm -f /tmp/site/index.html
          test ! -e /tmp/site/index.html
          test -s /tmp/site/assets/source-mc57-options-tab.js
          test -s /tmp/site/assets/source-mc57-restored-chart.js
          test -s /tmp/site/assets/source-mc57-tradingview-fallback.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages without root index
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/site

      - name: Deploy Pages without root index
        id: deployment
        uses: actions/deploy-pages@v4
