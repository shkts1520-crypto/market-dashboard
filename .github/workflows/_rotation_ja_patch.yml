name: Rotation Japanese Source Patch

on:
  push:
    branches:
      - fix/rotation-japanese-source-20260916

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-japanese-source-20260916
          fetch-depth: 1
      - name: Restore Japanese-first Rotation source format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/v38-canonical-binder.js')
          s = p.read_text(encoding='utf-8')

          old = "  const SECTORS = ['XLB','XLC','XLE','XLF','XLI','XLK','XLP','XLRE','XLU','XLV','XLY'];\n  const OPTION_BUCKETS"
          new = "  const SECTORS = ['XLB','XLC','XLE','XLF','XLI','XLK','XLP','XLRE','XLU','XLV','XLY'];\n  const SECTOR_LABELS = {XLB:'素材',XLC:'通信',XLE:'エネルギー',XLF:'金融',XLI:'資本財',XLK:'テクノロジー',XLP:'生活必需品',XLRE:'不動産',XLU:'公益',XLV:'ヘルスケア',XLY:'一般消費財'};\n  const OPTION_BUCKETS"
          assert old in s
          s = s.replace(old, new, 1)

          old = "heading(cardNode,'資金フロー（GICS11＋スタイル）','横=SPY比63営業日相対力、縦=10営業日RSモメンタム。中央100。元ネタ同様に4象限で読む。');"
          new = "heading(cardNode,'資金フロー（GICS11＋スタイル）','GICS11セクター＋スタイル5本をSPYとの相対力で配置。横=相対力（100が市場並み）、縦=その10日モメンタム。重複のない集合で「資金がどこへ移ったか」を見る。');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "[['主導 Leading',W-24,28,'end'],['改善 Improving',24,28,'start'],['停滞 Lagging',24,H-18,'start'],['弱化 Weakening',W-24,H-18,'end']]"
          new = "[['主導',W-24,28,'end'],['改善',24,28,'start'],['停滞',24,H-18,'start'],['弱化',W-24,H-18,'end']]"
          assert old in s
          s = s.replace(old, new, 1)

          old = "const t=document.createElementNS(svg.namespaceURI,'text');t.textContent=r.ticker;t.setAttribute('x',SX(x)+12);"
          new = "const t=document.createElementNS(svg.namespaceURI,'text');t.textContent=r.label||SECTOR_LABELS[r.ticker]||STYLE_LABELS[r.ticker]||r.ticker;t.setAttribute('x',SX(x)+12);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "const plot=el('div','v38-rrg-source');plot.appendChild(svg);cardNode.appendChild(plot);const legend=el('div','v38-rrg-legend');legend.innerHTML='<span><i class=\"gics\"></i>GICS11</span><span><i class=\"style\"></i>スタイルETF</span><span>中心=100</span>';cardNode.appendChild(legend);mark(cardNode,'data/ui_view_model.json.rotation.money_flow','READY');"
          new = "const plot=el('div','v38-rrg-source');plot.appendChild(svg);cardNode.appendChild(plot);const legend=el('div','v38-rrg-legend');legend.innerHTML='<span><i class=\"gics\"></i>GICS11セクター</span><span><i class=\"style\"></i>スタイル</span><span>中心=100</span>';cardNode.appendChild(legend);const qrows=el('div','v38-rrg-qrows');[['主導',(r)=>finite(r.x)>=100&&finite(r.y)>=100],['改善',(r)=>finite(r.x)<100&&finite(r.y)>=100],['弱化',(r)=>finite(r.x)>=100&&finite(r.y)<100],['停滞',(r)=>finite(r.x)<100&&finite(r.y)<100]].forEach(([q,pred])=>{const qr=el('div','v38-rrg-qrow');qr.appendChild(el('span','v38-rrg-qname',q));const chips=el('div','v38-rrg-chips');rows.filter(pred).sort((a,b)=>(finite(b.x)||0)-(finite(a.x)||0)).forEach((r)=>{const name=r.label||SECTOR_LABELS[r.ticker]||STYLE_LABELS[r.ticker]||r.ticker;const ch=el('span','v38-rrg-chip',`${name} ${r.ticker}`);chips.appendChild(ch);});if(!chips.childElementCount)chips.appendChild(el('span','mut','なし'));qr.appendChild(chips);qrows.appendChild(qr);});cardNode.appendChild(qrows);mark(cardNode,'data/ui_view_model.json.rotation.money_flow','READY');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "heading(cardNode,'セクター温度マップ Sector Heatmap','前日・1週・1カ月を切替。色だけでなく値も表示。');"
          new = "heading(cardNode,'セクター温度マップ','セクターETFの騰落率を強い順に確認。緑=上昇、赤=下落、濃さ=値幅。');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "const periods=[['1D','change_1d'],['1W','change_1w'],['1M','change_1m']];"
          new = "const periods=[['日','change_1d'],['週','change_1w'],['月','change_1m']];"
          assert old in s
          s = s.replace(old, new, 1)

          old = "cell.append(el('b','',ticker),el('span','',pct(v)));"
          new = "cell.append(el('b','',SECTOR_LABELS[ticker]||ticker),el('small','mut',ticker),el('span','',pct(v)));"
          assert old in s
          s = s.replace(old, new, 1)

          old = "heading(node,'広がり診断 Breadth Quality','指数の強さと、実際に50日線を上回る銘柄の広がりを同時確認。');"
          new = "heading(node,'指数と中身の乖離','指数（時価総額加重）と中身（等加重・Breadth）の差を見る。上位数銘柄だけで指数が持ち上がっていないかを確認。');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "<span>1W ${pct(a.change_1w)} / ${pct(b.change_1w)}</span><b>Gap ${pct(gap1)}</b></div><div class=\"v38-pair-values\"><span>1M ${pct(a.change_1m)} / ${pct(b.change_1m)}</span><b>Gap ${pct(gapm)}</b>"
          new = "<span>1週 ${pct(a.change_1w)} / ${pct(b.change_1w)}</span><b>乖離 ${pct(gap1)}</b></div><div class=\"v38-pair-values\"><span>1カ月 ${pct(a.change_1m)} / ${pct(b.change_1m)}</span><b>乖離 ${pct(gapm)}</b>"
          assert old in s
          s = s.replace(old, new, 1)

          replacements = {
            "'主導セクター・業種 Leading Groups'": "'主導セクター・業種'",
            "{label:'Group',key:'group',align:'left'}": "{label:'セクター',key:'group',align:'left'}",
            "{label:'1M',format:(r)=>pct(r.ret20_avg)}": "{label:'1カ月',format:(r)=>pct(r.ret20_avg)}",
            "{label:'Breadth50',format:(r)=>finite(r.above_sma50_pct)===null?'—':`${num(r.above_sma50_pct,0)}%`}": "{label:'50日線上',format:(r)=>finite(r.above_sma50_pct)===null?'—':`${num(r.above_sma50_pct,0)}%`}",
            "{label:'Members',key:'member_count'}": "{label:'銘柄数',key:'member_count'}",
            "'Universe内部の強さと広がり。'": "'ETFではなく構成銘柄の実データから算出。強さと広がりを同時に見る。'",
            "'強い業種の主導株 Leaders in Strong Groups'": "'強い業種の主導株'",
            "{label:'Ticker',key:'ticker',ticker:true,align:'left'}": "{label:'銘柄',key:'ticker',ticker:true,align:'left'}",
            "{label:'Theme',key:'group',align:'left'}": "{label:'業種',key:'group',align:'left'}",
            "{label:'Theme RS',format:(r)=>num(r.theme_rs,1)}": "{label:'テーマRS',format:(r)=>num(r.theme_rs,1)}",
            "{label:'Group RS63',format:(r)=>num(r.rs63_avg,1)}": "{label:'業種RS63',format:(r)=>num(r.rs63_avg,1)}",
            "'セクターETF強弱 Sector ETF Strength'": "'セクターETF強弱'",
            "{label:'#',key:'rank'}": "{label:'順位',key:'rank'}",
            "{label:'1D',format:(r)=>pct(r.d1)}": "{label:'日',format:(r)=>pct(r.d1)}",
            "{label:'1W',format:(r)=>pct(r.w1)}": "{label:'週',format:(r)=>pct(r.w1)}",
            "{label:'1M',format:(r)=>pct(r.m1)}": "{label:'月',format:(r)=>pct(r.m1)}",
            "{label:'Theme',key:'theme_name',align:'left'}": "{label:'サブテーマ',key:'theme_name',align:'left'}",
            "{label:'RS189',format:(r)=>num(r.rs189_median,1)}": "{label:'RS189',format:(r)=>num(r.rs189_median,1)}",
            "{label:'1M',format:(r)=>pct(r.ret20_median)}": "{label:'1カ月',format:(r)=>pct(r.ret20_median)}",
            "{label:'Leaders',format:(r)=>(r.leaders||[]).slice(0,3).join(' · ')}": "{label:'主導株',format:(r)=>(r.leaders||[]).slice(0,3).join(' · ')}",
            "heading(thermometer,'テーマの温度計 Major Theme','Sector ETFの重複表示ではなく、現行Theme診断を表示。');": "heading(thermometer,'テーマ温度計','現行Theme診断を日本語主体で表示。元ネタのテーマETF RRGとは別物なので混同しない。');",
          }
          for a,b in replacements.items():
              assert a in s, a
              s = s.replace(a,b,1)

          css_anchor = '.v38-sector-cell b,.v38-sector-cell span{display:block}.v38-sector-cell span{font-size:10px;margin-top:4px}'
          css_new = '.v38-sector-cell b,.v38-sector-cell small,.v38-sector-cell span{display:block}.v38-sector-cell small{font-size:8.5px;margin-top:1px}.v38-sector-cell span{font-size:10px;margin-top:4px}'
          assert css_anchor in s
          s = s.replace(css_anchor, css_new, 1)
          css_anchor = '.v38-rrg-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:#777;margin-top:7px}'
          css_new = css_anchor + '.v38-rrg-qrows{display:grid;gap:5px;margin-top:9px}.v38-rrg-qrow{display:grid;grid-template-columns:38px minmax(0,1fr);gap:7px;align-items:start}.v38-rrg-qname{font-size:10px;font-weight:900;color:#5f5b52}.v38-rrg-chips{display:flex;gap:5px;flex-wrap:wrap}.v38-rrg-chip{border:1px solid #d5d1c6;border-radius:999px;padding:3px 7px;background:#f6f4ee;font-size:9px;font-weight:750}'
          assert css_anchor in s
          s = s.replace(css_anchor, css_new, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('scripts/browser_data_completeness.py')
          s = p.read_text(encoding='utf-8')
          old = "    assert flow_card.locator('.v38-rrg-quadrant').count() == 4, (width, 'RRG quadrants missing')\n    heat = page.locator('#t-rotation .v38-sector-cell')\n    assert heat.count() == 11, (width, 'rotation heatmap must contain 11 GICS sectors', heat.count())\n    assert page.locator('#t-rotation .v38-heat-controls button').count() == 3, (width, 'rotation 1D/1W/1M heatmap controls missing')\n    breadth = page.locator('#t-rotation .card[data-v38-generated=\"breadth-quality\"]')"
          new = "    assert flow_card.locator('.v38-rrg-quadrant').count() == 4, (width, 'RRG quadrants missing')\n    quadrants = set(flow_card.locator('.v38-rrg-quadrant').all_inner_texts())\n    assert quadrants == {'主導', '改善', '弱化', '停滞'}, (width, 'RRG must be Japanese-first', quadrants)\n    assert flow_card.locator('.v38-rrg-qrow').count() == 4, (width, 'Japanese quadrant chip rows missing')\n    heat = page.locator('#t-rotation .v38-sector-cell')\n    assert heat.count() == 11, (width, 'rotation heatmap must contain 11 GICS sectors', heat.count())\n    assert heat.nth(0).locator('b').inner_text() == '素材', (width, 'heatmap sector name must be Japanese-first')\n    controls = page.locator('#t-rotation .v38-heat-controls button')\n    assert controls.count() == 3, (width, 'rotation 日/週/月 heatmap controls missing')\n    assert controls.all_inner_texts() == ['日', '週', '月'], (width, 'rotation heatmap controls must be Japanese', controls.all_inner_texts())\n    breadth = page.locator('#t-rotation .card[data-v38-generated=\"breadth-quality\"]')"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/v38-canonical-binder.js
          python -m py_compile scripts/browser_data_completeness.py
          git diff --check
      - name: Commit source-faithful Rotation and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_rotation_ja_patch.yml
          git add assets/v38-canonical-binder.js scripts/browser_data_completeness.py
          git commit -m 'Restore Japanese-first Rotation source format'
          git push origin HEAD:fix/rotation-japanese-source-20260916
