name: Research NQSAR Variant Validation

on:
  push:
    branches:
      - research/mc57-nqsar-recovery-20260912
    paths:
      - research/nqsar_variant_validation.py
      - .github/workflows/research-nqsar-variants.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance==0.2.66
      - name: Run NQSAR variants
        run: |
          set -euo pipefail
          python research/nqsar_variant_validation.py | tee nqsar_variant.log
      - name: Validate output
        run: |
          set -euo pipefail
          test -s research_out/nqsar_variant_validation.json
          python -m json.tool research_out/nqsar_variant_validation.json >/dev/null
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: nqsar-variant-validation
          path: |
            research_out/nqsar_variant_validation.json
            nqsar_variant.log
          if-no-files-found: error
          retention-days: 14
