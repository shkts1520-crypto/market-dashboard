name: One-off Core12 Liquidity Binding

on:
  push:
    branches:
      - fix/restore-visual-fidelity-20260916

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[core-liq-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-visual-fidelity-20260916
      - name: Apply Core12 utility binding
        run: |
          python scripts/apply_core12_liquidity_binding.py
          node --check assets/v38-canonical-binder.js
      - name: Run focused contracts
        run: |
          python -m pip install -q pytest
          PYTHONPATH=src pytest -q tests/test_visual_fidelity_contract.py tests/test_production_truth.py tests/test_v10_runtime.py
      - name: Remove one-off tooling
        run: |
          rm scripts/apply_core12_liquidity_binding.py
          rm .github/workflows/one-off-core12-liquidity-binding.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind Core 12 liquidity utility to live rows [core-liq-fix]"
          git push origin HEAD:fix/restore-visual-fidelity-20260916
