name: Canonical UI Audit

on:
  push:
    branches:
      - fix/single-canonical-binder-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical definitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('V38_Command_Center_mock_v5.html').read_text(encoding='utf-8')
          needles = [
              '資金フロー', 'GICS11', 'スタイル', 'STYLE', 'style',
              'エクイティカーブ', '来週の経済指標', '自分 vs QQQ',
              'CURRENT EXPECTED 12', 'RECOVERY CANDIDATES',
          ]
          for needle in needles:
              print('\n===== NEEDLE:', needle, '=====')
              found = 0
              for m in re.finditer(re.escape(needle), text, re.I):
                  lo=max(0,m.start()-2200); hi=min(len(text),m.end()+4200)
                  chunk=text[lo:hi].replace('\n',' ')
                  print(chunk)
                  found += 1
                  if found >= 4: break
              if not found: print('NOT_FOUND')
          print('\n===== ETF SYMBOL ARRAYS NEAR FLOW =====')
          for pat in [r'\[["\'][A-Z^=.-]{2,10}["\'](?:\s*,\s*["\'][A-Z^=.-]{2,10}["\']){3,20}\]',
                      r'(?:flow|FLOW|style|STYLE)[^;]{0,3000}']:
              for m in re.finditer(pat, text):
                  if any(x in m.group(0) for x in ('XLB','SPY','QQQ','RSP','IWM','IWF','IWD','MTUM','QUAL','USMV')):
                      print(m.group(0)[:5000])
          PY
