name: Canonical UI Audit

on:
  push:
    branches:
      - fix/single-canonical-binder-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical card inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from html import unescape
          text=Path('V38_Command_Center_mock_v5.html').read_text(encoding='utf-8')
          for sid in ['t-market','t-alloc','t-port','t-today','t-rotation','t-movers','t-rs','t-weekly','t-options','t-post1','t-rules']:
              m=re.search(rf'<section\s+id="{sid}"[^>]*>(.*?)(?=<section\s+id=|</main>|</body>)',text,re.S)
              print(f'\n=== {sid} ===')
              if not m:
                  print('MISSING');continue
              sec=m.group(1)
              hs=re.findall(r'<h2[^>]*>(.*?)</h2>',sec,re.S|re.I)
              for i,h in enumerate(hs,1):
                  h=re.sub(r'<[^>]+>',' ',h)
                  h=unescape(re.sub(r'\s+',' ',h)).strip()
                  print(f'{i:02d}. {h}')
          print('\n=== RRG STYLE TICKERS ===')
          for tk in ['XLB','XLC','XLE','XLF','XLI','XLK','XLP','XLRE','XLU','XLV','XLY','IWD','IWF','IWM','MDY','RSP']:
              print(tk)
          PY
