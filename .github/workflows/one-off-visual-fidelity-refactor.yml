name: One-off Visual Fidelity Refactor

on:
  push:
    branches:
      - fix/restore-visual-fidelity-20260916

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[vf-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-visual-fidelity-20260916
      - name: Apply refactor
        run: |
          python scripts/apply_visual_fidelity_refactor.py
          node --check assets/v38-canonical-binder.js
      - name: Run visual contract tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_visual_fidelity_contract.py
      - name: Remove one-off tooling
        run: |
          rm scripts/apply_visual_fidelity_refactor.py
          rm .github/workflows/one-off-visual-fidelity-refactor.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore source visual fidelity [vf-refactor]"
          git push origin HEAD:fix/restore-visual-fidelity-20260916
