name: Rotation Leader Placeholder Cleanup
on:
  push:
    branches: [fix/rotation-japanese-clean-20260916]
    paths: [.github/workflows/_rotation_no_dash.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-japanese-clean-20260916
          fetch-depth: 1
      - name: Remove fake-looking RS placeholders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/v38-canonical-binder.js')
          s=p.read_text(encoding='utf-8')
          old="const chip=el('button','chip v38-ticker-link',`${ticker}  RS${num(raw.rs189,0)}`);"
          new="const score=finite(raw.rs189),chip=el('button','chip v38-ticker-link',score===null?ticker:`${ticker}  RS${num(score,0)}`);"
          if old not in s: raise SystemExit('leader chip marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          q=Path('scripts/browser_data_completeness.py')
          t=q.read_text(encoding='utf-8')
          marker="    assert strong.locator('.v38-strong-theme-chips .v38-ticker-link').count() >= 1, (width, 'qualified leader chips missing')\n"
          repl=marker+"    assert 'RS—' not in strong.inner_text(), (width, 'missing RS must not render as a fake score placeholder')\n"
          if marker not in t: raise SystemExit('strong leader browser marker not found')
          q.write_text(t.replace(marker,repl,1),encoding='utf-8')
          PY
          node --check assets/v38-canonical-binder.js
          python -m py_compile scripts/browser_data_completeness.py
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/_rotation_no_dash.yml
          git add assets/v38-canonical-binder.js scripts/browser_data_completeness.py .github/workflows/_rotation_no_dash.yml
          git commit -m "Remove Rotation RS placeholders"
          git push origin HEAD:fix/rotation-japanese-clean-20260916
