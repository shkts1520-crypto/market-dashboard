name: Restore Pre-Merge Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-premerge-pages.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: restore-premerge-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download completed Run 31 Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/run31-artifact /tmp/run31-site
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10541501242/zip" > /tmp/run31-pages.zip
          unzip -q /tmp/run31-pages.zip -d /tmp/run31-artifact
          tar -xf /tmp/run31-artifact/artifact.tar -C /tmp/run31-site

      - name: Verify exact pre-merge state
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/run31-site/index.html
          test -s /tmp/run31-site/source-mc57.html
          test -s /tmp/run31-site/assets/source-mc57-options-tab.js
          test -s /tmp/run31-site/assets/source-mc57-restored-chart.js
          test -s /tmp/run31-site/assets/source-mc57-tradingview-fallback.js
          test ! -e /tmp/run31-site/assets/source-mc57-navigation.js
          ! grep -q 'source-mc57-navigation.js' /tmp/run31-site/source-mc57.html
          INDEX_SHA="$(sha256sum /tmp/run31-site/index.html | cut -d' ' -f1)"
          test "$INDEX_SHA" = "cf48430f365b920a54ee5eb83330025e22c0fd46af6c3a37f99c7ee0c4b50b40"
          echo "index_sha=$INDEX_SHA"
          echo "source_size=$(stat -c %s /tmp/run31-site/source-mc57.html)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact Run 31 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/run31-site

      - name: Deploy exact Run 31 state
        id: deployment
        uses: actions/deploy-pages@v4
