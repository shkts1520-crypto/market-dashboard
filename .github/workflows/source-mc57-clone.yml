name: Exact Site Mirror Backup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-mc57-clone.yml
  schedule:
    # 06:45 JST every morning (GitHub cron is UTC).
    - cron: '45 21 * * *'
  workflow_run:
    workflows:
      - V38 Production Full Pipeline
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: exact-site-mirror-pages
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Recover Production Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -n1)"
          test -n "$ARTIFACT_ID"
          rm -rf /tmp/v38-pages-artifact /tmp/v38-pages.zip
          mkdir -p /tmp/v38-pages-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v38-pages.zip
          unzip -q /tmp/v38-pages.zip -d /tmp/v38-pages-artifact
          printf '%s\n' "$RUN_ID" > /tmp/production-run-id.txt

      - name: Unpack Production Pages byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          TAR="$(find /tmp/v38-pages-artifact -type f -name '*.tar' | head -n1)"
          test -n "$TAR"
          tar -xf "$TAR" -C _site
          test -s _site/index.html
          sha256sum _site/index.html | tee /tmp/index.sha256

      - name: Mirror index to source page byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cp _site/index.html _site/source-mc57.html
          test -s _site/source-mc57.html
          cmp --silent _site/index.html _site/source-mc57.html
          sha256sum _site/source-mc57.html | tee /tmp/source-mc57.sha256
          INDEX_SHA="$(cut -d' ' -f1 /tmp/index.sha256)"
          SOURCE_SHA="$(cut -d' ' -f1 /tmp/source-mc57.sha256)"
          test "$INDEX_SHA" = "$SOURCE_SHA"
          echo "exact mirror sha256: $INDEX_SHA"

      - name: Upload mirror proof
        uses: actions/upload-artifact@v4
        with:
          name: exact-site-mirror-proof-${{ github.run_id }}
          path: |
            /tmp/index.sha256
            /tmp/source-mc57.sha256
            /tmp/production-run-id.txt
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact with exact mirror
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy unchanged Production plus exact mirror
        id: deployment
        uses: actions/deploy-pages@v4
