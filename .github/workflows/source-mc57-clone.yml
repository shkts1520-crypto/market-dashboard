name: Exact Source MC57 Clone
# FRED/Yahoo recovery pipeline trigger
# Final regression-guard run: market-cap snapshot is preserved for Setup/Movers.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-mc57-clone.yml
      - scripts/build_exact_source_mc57_clone.py
      - assets/source-mc57-options-tab.js
      - assets/source-mc57-restored-chart.js
      - assets/source-mc57-tradingview-fallback.js
  schedule:
    # 06:45 JST every morning (GitHub cron is UTC).
    - cron: '45 21 * * *'
  workflow_run:
    workflows:
      - V38 Production Full Pipeline
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: exact-source-mc57-pages
  cancel-in-progress: false

jobs:
  append-clone-and-deploy:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clone dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . 'yfinance==0.2.66' 'pandas<3'

      - name: Recover Production raw acquisition handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_HANDOFF: ${{ runner.temp }}/v38-production-handoff
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          rm -rf "$PRODUCTION_HANDOFF"
          mkdir -p "$PRODUCTION_HANDOFF"

          find_artifact() {
            local run_id="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[] | select(.name=="v38-production-live-handoff" and .expired==false) | .id' \
              | head -n1 || true
          }

          RUN_ID=""
          ARTIFACT_ID=""
          if [ -n "${TRIGGER_RUN_ID:-}" ]; then
            CANDIDATE="$(find_artifact "$TRIGGER_RUN_ID")"
            if [ -n "$CANDIDATE" ]; then
              RUN_ID="$TRIGGER_RUN_ID"
              ARTIFACT_ID="$CANDIDATE"
            fi
          fi

          if [ -z "$ARTIFACT_ID" ]; then
            while read -r CANDIDATE_RUN_ID; do
              test -n "$CANDIDATE_RUN_ID" || continue
              CANDIDATE="$(find_artifact "$CANDIDATE_RUN_ID")"
              if [ -n "$CANDIDATE" ]; then
                RUN_ID="$CANDIDATE_RUN_ID"
                ARTIFACT_ID="$CANDIDATE"
                break
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].id')
          fi

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::No Production raw handoff artifact is available; clone will use the preserved legacy acquisition fallback."
            exit 0
          fi

          echo "Using Production raw handoff from run $RUN_ID artifact $ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/v38-production-handoff.zip"
          unzip -q "$RUNNER_TEMP/v38-production-handoff.zip" -d "$PRODUCTION_HANDOFF"
          test -s "$PRODUCTION_HANDOFF/ohlcv.csv"
          test -s "$PRODUCTION_HANDOFF/universe.csv"
          test -s "$PRODUCTION_HANDOFF/handoff.json"

      - name: Refresh isolated clone data from the existing live acquisition route
        shell: bash
        env:
          CLONE_DATA: ${{ runner.temp }}/v38-clone-data
          CLONE_WORK: ${{ runner.temp }}/v38-clone-live
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$CLONE_DATA" "$CLONE_WORK"
          cp -a data "$CLONE_DATA"
          mkdir -p "$CLONE_WORK"

          # Never let a transient benchmark response move the clone backward.
          # Read the maximum session from recent successful clone preservation
          # artifacts; if the provider cannot still serve that session, the run
          # fails before deployment and the existing published page is retained.
          PREVIOUS_CLONE_SESSION=""
          PREVIOUS_CLONE_ZIP=""
          mkdir -p "$RUNNER_TEMP/v38-clone-session-history"
          while read -r RUN_ID; do
            test -n "$RUN_ID" || continue
            ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("exact-source-mc57-preservation-")) | .id' | head -n1 || true)"
            test -n "$ARTIFACT_ID" || continue
            ZIP="$RUNNER_TEMP/v38-clone-session-history/${RUN_ID}.zip"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ZIP"; then
              SESSION="$(unzip -p "$ZIP" repo_data/state.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("session_date",""))' 2>/dev/null || true)"
              if [[ "$SESSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                if [[ -z "$PREVIOUS_CLONE_SESSION" || "$SESSION" > "$PREVIOUS_CLONE_SESSION" ]]; then
                  PREVIOUS_CLONE_SESSION="$SESSION"
                  PREVIOUS_CLONE_ZIP="$ZIP"
                fi
              fi
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/source-mc57-clone.yml/runs?branch=main&status=success&per_page=6" --jq '.workflow_runs[].id')
          export PREVIOUS_CLONE_SESSION
          export PREVIOUS_CLONE_ZIP
          echo "previous published clone session: ${PREVIOUS_CLONE_SESSION:-none}"

          # Reuse the last successful sector-history cache as a seed. This keeps
          # Publish history continuous even if Yahoo temporarily misses one ETF.
          rm -f "$CLONE_WORK/previous_market_inputs.json"
          if [ -n "$PREVIOUS_CLONE_ZIP" ] && [ -f "$PREVIOUS_CLONE_ZIP" ]; then
            unzip -p "$PREVIOUS_CLONE_ZIP" repo_data/market_inputs.json > "$CLONE_WORK/previous_market_inputs.json" 2>/dev/null || rm -f "$CLONE_WORK/previous_market_inputs.json"
          fi

          if [ -s "$RUNNER_TEMP/v38-production-handoff/handoff.json" ]; then
            PYTHONPATH=src python scripts/prepare_source_clone_from_production.py \
              --data-dir "$CLONE_DATA" \
              --work-dir "$CLONE_WORK" \
              --handoff-dir "$RUNNER_TEMP/v38-production-handoff" \
              --previous-market-inputs "$CLONE_WORK/previous_market_inputs.json"
            echo "source-mc57 reused Production stock OHLCV and Production MC57; full-universe Yahoo re-download skipped"
            exit 0
          fi

          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import yfinance as yf

          from v38.live_acquisition import (
              choose_completed_session,
              _download,
              download_market_inputs,
              download_stock_ohlcv,
              fetch_benchmark_frames,
              market_rows,
              fetch_tradingview_response,
              frame_dates,
              parse_tradingview_universe,
              prevent_session_regression,
              previous_active_universe,
              select_yfinance_symbol_frame,
              state_object,
              validate_universe_count,
              write_json,
              write_universe_csv,
          )
          from v38.stock_adapter import calculate_from_files

          data_dir = Path(os.environ["CLONE_DATA"])
          work_dir = Path(os.environ["CLONE_WORK"])
          generated_at = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )

          previous_clone_session = os.environ.get("PREVIOUS_CLONE_SESSION") or None
          previous_clone_zip = os.environ.get("PREVIOUS_CLONE_ZIP") or None
          try:
              benchmarks = fetch_benchmark_frames(yf)
              observed_session = choose_completed_session(
                  frame_dates(benchmarks["QQQ"]),
                  frame_dates(benchmarks["SPY"]),
              )
          except Exception as exc:
              if previous_clone_session and previous_clone_zip:
                  # Benchmark/Yahoo failure must not erase market caps used by
                  # Setup/Movers. TradingView already provides market_cap_basic,
                  # so preserve that route even when the rest of the session is
                  # reused from the last successful preservation artifact.
                  try:
                      tv_response = fetch_tradingview_response()
                      universe_rows, _ = parse_tradingview_universe(
                          tv_response,
                          session_date=previous_clone_session,
                      )
                      previous_count = previous_active_universe(data_dir / "rs.json")
                      validate_universe_count(len(universe_rows), previous_count)
                      write_universe_csv(
                          work_dir / "universe.csv",
                          universe_rows,
                      )
                  except Exception as tv_exc:
                      print(
                          json.dumps(
                              {
                                  "market_cap_route_failed": True,
                                  "market_cap_error": str(tv_exc),
                              },
                              sort_keys=True,
                          )
                      )
                  print(
                      json.dumps(
                          {
                              "benchmark_acquisition_failed": True,
                              "benchmark_error": str(exc),
                              "retained_published_session": previous_clone_session,
                              "reuse_previous_preservation": True,
                          },
                          sort_keys=True,
                      )
                  )
                  (work_dir / ".reuse_previous_preservation").write_text(
                      previous_clone_session,
                      encoding="utf-8",
                  )
                  raise SystemExit(0)
              raise
          session = prevent_session_regression(
              observed_session,
              previous_clone_session,
          )
          if previous_clone_session and session != observed_session:
              # Keep current TradingView market-cap data even while retaining
              # the prior completed price session.
              try:
                  tv_response = fetch_tradingview_response()
                  universe_rows, _ = parse_tradingview_universe(
                      tv_response,
                      session_date=session,
                  )
                  previous_count = previous_active_universe(data_dir / "rs.json")
                  validate_universe_count(len(universe_rows), previous_count)
                  write_universe_csv(
                      work_dir / "universe.csv",
                      universe_rows,
                  )
              except Exception as tv_exc:
                  print(
                      json.dumps(
                          {
                              "market_cap_route_failed": True,
                              "market_cap_error": str(tv_exc),
                          },
                          sort_keys=True,
                      )
                  )
              print(
                  json.dumps(
                      {
                          "benchmark_observed_session": observed_session,
                          "retained_published_session": session,
                          "session_regression_prevented": True,
                          "reuse_previous_preservation": True,
                      },
                      sort_keys=True,
                  )
              )
              (work_dir / ".reuse_previous_preservation").write_text(
                  session,
                  encoding="utf-8",
              )
              raise SystemExit(0)

          tv_response = fetch_tradingview_response()
          universe_rows, _ = parse_tradingview_universe(
              tv_response,
              session_date=session,
          )
          previous_count = previous_active_universe(data_dir / "rs.json")
          validate_universe_count(len(universe_rows), previous_count)

          universe_path = write_universe_csv(
              work_dir / "universe.csv",
              universe_rows,
          )
          ohlcv_path = work_dir / "ohlcv.csv"
          yahoo_stats = download_stock_ohlcv(
              yf,
              [row["ticker"] for row in universe_rows],
              target_session=session,
              output_path=ohlcv_path,
          )

          source = (
              "TradingView america/scan universe + Yahoo Finance/yfinance "
              "0.2.66 adjusted by Adj Close"
          )
          calculate_from_files(
              ohlcv_path,
              universe_path,
              data_dir,
              session_date=session,
              generated_at=generated_at,
              source=source,
          )

          previous_market_path = data_dir / "market_inputs.json"
          previous_market = {}
          if previous_market_path.is_file():
              try:
                  previous_market = json.loads(
                      previous_market_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  previous_market = {}

          market_inputs = download_market_inputs(
              yf,
              target_session=session,
              generated_at=generated_at,
          )

          # Publish/Sector Rotation uses the 11 equal-weight GICS ETFs.
          # The production market-input set contains cap-weighted XLB/XLK/etc.,
          # so the original Publish code received MAJ=[] and drew blank panels.
          # Fetch the exact RSP* histories expected by build_dashboard(4).py,
          # merge with the last successful preservation, and refuse to publish
          # unless all 11 have enough history for RS189.
          publish_sector_symbols = (
              "RSPT", "RSPF", "RSPN", "RSPD", "RSPM", "RSPC",
              "RSPU", "RSPS", "RSPH", "RSPR", "RSPG",
          )
          previous_publish_market = {}
          previous_publish_path = work_dir / "previous_market_inputs.json"
          if previous_publish_path.is_file():
              try:
                  previous_publish_market = json.loads(
                      previous_publish_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  previous_publish_market = {}

          try:
              publish_raw = _download(
                  yf, list(publish_sector_symbols), period="2y", threads=False
              )
          except Exception:
              publish_raw = None

          publish_fresh = {}
          for symbol in publish_sector_symbols:
              rows = market_rows(
                  select_yfinance_symbol_frame(publish_raw, symbol)
                  if publish_raw is not None else None,
                  target_session=session,
                  max_rows=520,
              )
              if not rows or rows[-1]["date"] != session:
                  try:
                      retry_raw = _download(yf, [symbol], period="2y", threads=False)
                  except Exception:
                      retry_raw = None
                  retried = market_rows(
                      select_yfinance_symbol_frame(retry_raw, symbol)
                      if retry_raw is not None else None,
                      target_session=session,
                      max_rows=520,
                  )
                  if retried:
                      rows = retried
              publish_fresh[symbol] = rows

          previous_publish_series = (
              previous_publish_market.get("series")
              if isinstance(previous_publish_market.get("series"), dict)
              else {}
          )
          for symbol in publish_sector_symbols:
              by_date = {}
              old_rows = previous_publish_series.get(symbol)
              new_rows = publish_fresh.get(symbol)
              if isinstance(old_rows, list):
                  for row in old_rows:
                      if isinstance(row, dict) and isinstance(row.get("date"), str):
                          by_date[row["date"]] = row
              if isinstance(new_rows, list):
                  for row in new_rows:
                      if isinstance(row, dict) and isinstance(row.get("date"), str):
                          by_date[row["date"]] = row
              merged = [
                  by_date[d]
                  for d in sorted(by_date)
                  if d <= session
              ][-520:]
              market_inputs.setdefault("series", {})[symbol] = merged

          publish_sector_counts = {
              symbol: len(market_inputs.get("series", {}).get(symbol) or [])
              for symbol in publish_sector_symbols
          }
          publish_sector_latest = {
              symbol: (
                  (market_inputs.get("series", {}).get(symbol) or [{}])[-1].get("date")
                  if market_inputs.get("series", {}).get(symbol)
                  else None
              )
              for symbol in publish_sector_symbols
          }
          publish_sector_bad = [
              symbol for symbol in publish_sector_symbols
              if publish_sector_counts[symbol] < 190
              or publish_sector_latest[symbol] != session
          ]
          if publish_sector_bad:
              raise RuntimeError(
                  "Publish major-sector history incomplete: "
                  + json.dumps(
                      {
                          "bad": publish_sector_bad,
                          "counts": publish_sector_counts,
                          "latest": publish_sector_latest,
                          "session": session,
                      },
                      sort_keys=True,
                  )
              )
          print(
              json.dumps(
                  {
                      "publish_major_sector_history": "READY",
                      "counts": publish_sector_counts,
                      "latest": publish_sector_latest,
                  },
                  sort_keys=True,
              )
          )

          # Preserve valid prior history while replacing same-date rows with the
          # newly acquired session. The exact source UI calculates legacy
          # diagnostics from overlapping QQQ/SPY/HYG/LQD/RSP/IWM/VIX history;
          # a provider may return only a short current slice for one symbol.
          repo_prior_series = (
              previous_market.get("series")
              if isinstance(previous_market.get("series"), dict)
              else {}
          )
          preserved_prior_series = (
              previous_publish_market.get("series")
              if isinstance(previous_publish_market.get("series"), dict)
              else {}
          )
          fresh_series = (
              market_inputs.get("series")
              if isinstance(market_inputs.get("series"), dict)
              else {}
          )
          merged_series = {}
          for symbol in sorted(
              set(repo_prior_series) | set(preserved_prior_series) | set(fresh_series)
          ):
              by_date = {}
              for source_rows in (
                  repo_prior_series.get(symbol),
                  preserved_prior_series.get(symbol),
                  fresh_series.get(symbol),
              ):
                  if isinstance(source_rows, list):
                      for row in source_rows:
                          if isinstance(row, dict) and isinstance(row.get("date"), str):
                              by_date[row["date"]] = row
              merged_series[symbol] = [
                  by_date[d]
                  for d in sorted(by_date)
                  if d <= session
              ][-520:]
          market_inputs["series"] = merged_series

          required_history = ("QQQ", "SPY", "HYG", "LQD", "RSP", "IWM", "^VIX")
          history_counts = {
              symbol: len(merged_series.get(symbol) or [])
              for symbol in required_history
          }
          if history_counts["QQQ"] < 200 or history_counts["SPY"] < 200:
              raise RuntimeError(
                  "clone market history too short after merge: "
                  + json.dumps(history_counts, sort_keys=True)
              )

          write_json(data_dir / "market_inputs.json", market_inputs)
          print(
              json.dumps(
                  {
                      "clone_market_history_counts": history_counts,
                      "clone_market_history_merged": True,
                  },
                  sort_keys=True,
              )
          )
          write_json(
              data_dir / "state.json",
              state_object(
                  session_date=session,
                  generated_at=generated_at,
                  coverage=float(yahoo_stats["target_session_coverage"]),
              ),
          )

          print(
              json.dumps(
                  {
                      "session_date": session,
                      "active_universe": len(universe_rows),
                      "stock_coverage": float(yahoo_stats["target_session_coverage"]),
                  },
                  sort_keys=True,
              )
          )
          PY

          if [ -f "$CLONE_WORK/.reuse_previous_preservation" ]; then
            test -n "$PREVIOUS_CLONE_ZIP"
            REUSE_DIR="$RUNNER_TEMP/v38-clone-preservation-reuse"
            rm -rf "$REUSE_DIR" "$CLONE_DATA"
            mkdir -p "$REUSE_DIR" "$CLONE_DATA" "$CLONE_WORK"
            unzip -q "$PREVIOUS_CLONE_ZIP" 'repo_data/*' 'raw_input/ohlcv.csv' -d "$REUSE_DIR"
            cp -a "$REUSE_DIR/repo_data/." "$CLONE_DATA/"
            cp "$REUSE_DIR/raw_input/ohlcv.csv" "$CLONE_WORK/ohlcv.csv"
            RESTORED_SESSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("session_date",""))' "$CLONE_DATA/state.json")"
            test "$RESTORED_SESSION" = "$PREVIOUS_CLONE_SESSION"
            echo "reused successful clone preservation for session $RESTORED_SESSION"
          else
            PYTHONPATH=src python scripts/calculate_mc57_live.py \
              --data-dir "$CLONE_DATA" \
              --reference config/mc57_reference.json \
              --golden-fixture tests/fixtures/mc57_recovery_golden_20260909_11.json \
              --force
          fi

      - name: Recover exact Pages artifact from Production
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/v38-pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Recover current non-expired Pages artifact for direct or manual run
        if: github.event_name != 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=""
          ARTIFACT_ID=""
          while read -r CANDIDATE_RUN_ID; do
            test -n "$CANDIDATE_RUN_ID" || continue
            CANDIDATE_ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id' | head -n1 || true)"
            if [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
              RUN_ID="$CANDIDATE_RUN_ID"
              ARTIFACT_ID="$CANDIDATE_ARTIFACT_ID"
              break
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].id')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No non-expired Production github-pages artifact is available. Run V38 Production Full Pipeline first."
            exit 1
          fi

          echo "Using Production run $RUN_ID artifact $ARTIFACT_ID"
          rm -rf /tmp/v38-pages-artifact /tmp/v38-pages.zip
          mkdir -p /tmp/v38-pages-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v38-pages.zip
          unzip -q /tmp/v38-pages.zip -d /tmp/v38-pages-artifact

      - name: Unpack Production Pages byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          TAR="$(find /tmp/v38-pages-artifact -type f -name '*.tar' | head -n1)"
          test -n "$TAR"
          tar -xf "$TAR" -C _site
          test -s _site/index.html
          sha256sum _site/index.html | tee /tmp/index.before.sha256

      - name: Build separate exact source page with MC57 only
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v38-clone-live"
          PYTHONPATH=src python scripts/build_exact_source_mc57_clone.py \
            --repo-root . \
            --data-dir "$RUNNER_TEMP/v38-clone-data" \
            --source-dir sources/build_dashboard_4 \
            --work-dir "$RUNNER_TEMP/v38-clone-live" \
            --output _site/source-mc57.html
          test -s _site/source-mc57.html

      - name: Prove existing page was not changed
        shell: bash
        run: |
          set -euo pipefail
          sha256sum _site/index.html | tee /tmp/index.after.sha256
          cmp /tmp/index.before.sha256 /tmp/index.after.sha256
          grep -q 'マーケットステータス（地合いスコア）' _site/source-mc57.html
          grep -q '地合いスコアの内訳（4本柱）' _site/source-mc57.html

      - name: Assemble exact reproduction preservation kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/mc57-preservation"
          rm -rf "$KIT"
          mkdir -p "$KIT"/{source,repo_data,raw_input,code,output,frozen_runtime,environment}

          cp -a sources/build_dashboard_4/. "$KIT/source/archive_parts/"
          SOURCE_TMP="$(find /tmp -maxdepth 1 -type d -name 'v38-exact-mc57-clone-*' | sort | tail -n1)"
          test -n "$SOURCE_TMP"
          cp -a "$SOURCE_TMP/." "$KIT/frozen_runtime/"
          cp "$SOURCE_TMP/build_dashboard_4.py" "$KIT/source/build_dashboard(4).py"

          cp "$RUNNER_TEMP/v38-clone-data/state.json" "$KIT/repo_data/"
          cp "$RUNNER_TEMP/v38-clone-data/rs.json" "$KIT/repo_data/"
          cp "$RUNNER_TEMP/v38-clone-data/market_inputs.json" "$KIT/repo_data/"
          cp "$RUNNER_TEMP/v38-clone-data/mc57.json" "$KIT/repo_data/"
          if [ -f "$RUNNER_TEMP/v38-clone-data/fred_cache.json" ]; then cp "$RUNNER_TEMP/v38-clone-data/fred_cache.json" "$KIT/repo_data/fred_cache.json"; fi
          if [ -f "$SOURCE_TMP/mktcap.json" ]; then cp "$SOURCE_TMP/mktcap.json" "$KIT/repo_data/mktcap.json"; fi
          if [ -f "$RUNNER_TEMP/v38-clone-data/theme_membership.json" ]; then cp "$RUNNER_TEMP/v38-clone-data/theme_membership.json" "$KIT/repo_data/"; fi
          if [ -f "$RUNNER_TEMP/v38-clone-data/acquisition_manifest.json" ]; then cp "$RUNNER_TEMP/v38-clone-data/acquisition_manifest.json" "$KIT/repo_data/"; fi

          cp "$RUNNER_TEMP/v38-clone-live/ohlcv.csv" "$KIT/raw_input/ohlcv.csv"
          if [ -f "$RUNNER_TEMP/v38-clone-live/universe.csv" ]; then cp "$RUNNER_TEMP/v38-clone-live/universe.csv" "$KIT/raw_input/universe.csv"; fi
          cp scripts/build_exact_source_mc57_clone.py "$KIT/code/"
          cp assets/source-mc57-options-tab.js "$KIT/code/"
          cp assets/source-mc57-restored-chart.js "$KIT/code/"
          cp assets/source-mc57-tradingview-fallback.js "$KIT/code/"
          cp src/v38/live_acquisition.py "$KIT/code/"
          cp pyproject.toml "$KIT/code/"
          cp .github/workflows/source-mc57-clone.yml "$KIT/code/"

          cp _site/source-mc57.html "$KIT/output/"
          if [ -f _site/source-mc57_share.html ]; then cp _site/source-mc57_share.html "$KIT/output/"; fi
          cp /tmp/index.before.sha256 "$KIT/output/original-index.sha256"

          python -m pip freeze > "$KIT/environment/pip-freeze.txt"
          python --version > "$KIT/environment/python-version.txt" 2>&1
          uname -a > "$KIT/environment/runner-uname.txt"
          printf '%s\n' "6ce79cb01e6430ff70208daa0adbfdfbfb7f0559" > "$KIT/environment/reference-main-commit.txt"
          printf '%s\n' "ee306726ee4b629f92c5d2d6687c06869702030f60922c93f44ead713bc8bb80" > "$KIT/source/EXPECTED_SOURCE_SHA256.txt"

          cat > "$KIT/README-FIRST.txt" <<'EOF'
          V38 Exact Source MC57 preservation kit
          Session: current isolated clone refresh
          Purpose: preserve every input and generated cache needed to reproduce source-mc57.html.
          Canonical source SHA256: ee306726ee4b629f92c5d2d6687c06869702030f60922c93f44ead713bc8bb80
          Market Condition source: repo_data/mc57.json
          Existing index.html was not modified; its SHA is output/original-index.sha256.
          raw_input/ohlcv.csv is the verified Production post-gap-repair OHLCV handoff; legacy direct acquisition is used only when no Production handoff artifact exists.
          frozen_runtime/ contains the exact temporary runtime cache generated by build_dashboard(4).py.
          EOF

          (cd "$KIT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload exact reproduction preservation kit
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-mc57-preservation-${{ github.run_id }}
          path: ${{ runner.temp }}/mc57-preservation
          retention-days: 90
          if-no-files-found: error

      - name: Preserve Production root page in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/source-mc57.html
          sha256sum _site/index.html | tee /tmp/index.deploy.sha256
          cmp /tmp/index.before.sha256 /tmp/index.deploy.sha256

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact with separate clone
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy unchanged Production artifact plus clone
        id: deployment
        uses: actions/deploy-pages@v4
