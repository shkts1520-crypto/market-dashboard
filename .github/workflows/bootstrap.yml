name: Install V38 Safe UI Shell v9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Verify v8 baseline and canonical
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=src pytest -q

          BASE_COUNT="$(
            PYTHONPATH=src \
            pytest \
              -o addopts='' \
              --collect-only \
              -q \
            | grep -c '::'
          )"

          echo "Baseline tests: $BASE_COUNT"

          if [ "$BASE_COUNT" != "148" ]; then
            echo "::error::Expected v8 baseline of exactly 148 tests, got $BASE_COUNT"
            exit 1
          fi

          test -f V38_Command_Center_mock_v5.html

          SHA="$(
            git hash-object \
              V38_Command_Center_mock_v5.html
          )"

          SIZE="$(
            wc -c \
              < V38_Command_Center_mock_v5.html \
            | tr -d '[:space:]'
          )"

          echo "Canonical blob SHA: $SHA"
          echo "Canonical bytes: $SIZE"

          if [ "$SHA" != "966fe157e3d35344f6e373877b3de5689409dd67" ]; then
            echo "::error::Canonical v5 blob SHA mismatch"
            exit 1
          fi

          if [ "$SIZE" != "1412062" ]; then
            echo "::error::Canonical v5 byte-size mismatch"
            exit 1
          fi

      - name: Write v9 safe shell builder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            src/v38 \
            scripts \
            assets \
            tests \
            docs

          cat > src/v38/ui_contract.py <<'V38V9_0'
          from __future__ import annotations

          import re
          from html.parser import HTMLParser
          from typing import Any

          EXPECTED_TABS = (
              ("Daily", "#t-market"),
              ("Positions", "#t-alloc"),
              ("Core 12", "#t-port"),
              ("Rotation", "#t-rotation"),
              ("RS", "#t-rs"),
              ("Weekly", "#t-weekly"),
              ("Options", "#t-options"),
              ("Publish", "#t-post1"),
              ("Rules", "#t-rules"),
          )

          FORBIDDEN_TABS = {
              "Setups",
              "Movers",
          }

          REQUIRED_VISUAL_TOKENS = (
              ".card",
              ".chart",
              ".rsx-card",
              ".rsx-item",
              ".mrow",
              ".bflags",
          )

          PRODUCTION_FORBIDDEN_PATTERNS = (
              r"Entry\s*\*\s*0\.75",
              r"entry\s*\*\s*0\.75",
              r"TQQQ\s*/\s*SOXL",
              r"隔週リバランス",
              r"21EMA.*Exit",
              r"10SMA.*Exit",
              r"ATR2",
              r"建値Stop",
          )

          _SCRIPT_RE = re.compile(
              (
                  r"<script\b"
                  r"(?P<attrs>[^>]*)>"
                  r"(?P<body>.*?)"
                  r"</script\s*>"
              ),
              re.I | re.S,
          )

          _EVENT_RE = re.compile(
              (
                  r"\s+on[a-zA-Z0-9_-]+"
                  r"\s*=\s*"
                  r"(?:"
                  r"\"[^\"]*\""
                  r"|'[^']*'"
                  r"|[^\s>]+"
                  r")"
              ),
              re.I | re.S,
          )

          _SRC_RE = re.compile(
              r"\bsrc\s*=",
              re.I,
          )


          class UIContractError(RuntimeError):
              pass


          class _NavParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.in_nav = 0
                  self.capture_anchor = False
                  self.anchor_href: str | None = None
                  self.anchor_text: list[str] = []
                  self.tabs: list[
                      tuple[str, str | None]
                  ] = []
                  self.section_ids: set[str] = set()

              def handle_starttag(
                  self,
                  tag: str,
                  attrs: list[
                      tuple[str, str | None]
                  ],
              ) -> None:
                  amap = dict(attrs)

                  if tag == "nav":
                      self.in_nav += 1

                  elif (
                      tag == "section"
                      and amap.get("id")
                  ):
                      self.section_ids.add(
                          str(amap["id"])
                      )

                  elif (
                      tag == "a"
                      and self.in_nav
                  ):
                      classes = set(
                          (
                              amap.get("class")
                              or ""
                          ).split()
                      )

                      if "tabx" in classes:
                          self.capture_anchor = True
                          self.anchor_href = (
                              amap.get("href")
                          )
                          self.anchor_text = []

              def handle_data(
                  self,
                  data: str,
              ) -> None:
                  if self.capture_anchor:
                      self.anchor_text.append(
                          data
                      )

              def handle_endtag(
                  self,
                  tag: str,
              ) -> None:
                  if (
                      tag == "a"
                      and self.capture_anchor
                  ):
                      label = " ".join(
                          "".join(
                              self.anchor_text
                          ).split()
                      )

                      self.tabs.append(
                          (
                              label,
                              self.anchor_href,
                          )
                      )

                      self.capture_anchor = False
                      self.anchor_href = None
                      self.anchor_text = []

                  elif (
                      tag == "nav"
                      and self.in_nav
                  ):
                      self.in_nav -= 1


          def inspect_shell(
              html: str,
          ) -> dict[str, Any]:
              if (
                  not isinstance(
                      html,
                      str,
                  )
                  or not html.strip()
              ):
                  raise UIContractError(
                      "HTML is empty"
                  )

              parser = _NavParser()
              parser.feed(html)

              expected = list(
                  EXPECTED_TABS
              )

              missing_visual = [
                  token
                  for token
                  in REQUIRED_VISUAL_TOKENS
                  if token not in html
              ]

              missing_sections = [
                  href[1:]
                  for _, href
                  in EXPECTED_TABS
                  if href[1:]
                  not in parser.section_ids
              ]

              forbidden_present = [
                  label
                  for label, _
                  in parser.tabs
                  if label
                  in FORBIDDEN_TABS
              ]

              return {
                  "tabs": parser.tabs,
                  "tabs_exact": (
                      parser.tabs
                      == expected
                  ),
                  "forbidden_tabs": (
                      forbidden_present
                  ),
                  "missing_sections": (
                      missing_sections
                  ),
                  "missing_visual_tokens": (
                      missing_visual
                  ),
              }


          def validate_canonical_shell(
              html: str,
          ) -> dict[str, Any]:
              report = inspect_shell(
                  html
              )

              problems: list[str] = []

              if not report["tabs_exact"]:
                  problems.append(
                      "tabs must equal "
                      f"{list(EXPECTED_TABS)!r}; "
                      f"got {report['tabs']!r}"
                  )

              if report["forbidden_tabs"]:
                  problems.append(
                      "forbidden tabs present: "
                      f"{report['forbidden_tabs']}"
                  )

              if report["missing_sections"]:
                  problems.append(
                      "missing tab sections: "
                      f"{report['missing_sections']}"
                  )

              if report[
                  "missing_visual_tokens"
              ]:
                  problems.append(
                      "missing v5 visual tokens: "
                      f"{report['missing_visual_tokens']}"
                  )

              if problems:
                  raise UIContractError(
                      "; ".join(
                          problems
                      )
                  )

              return report


          def active_logic_fragments(
              html: str,
          ) -> list[str]:
              """
              Return executable inline fragments only.

              Visible document prose is deliberately
              excluded from legacy-logic scanning.
              """
              fragments: list[str] = []

              for match in (
                  _SCRIPT_RE.finditer(
                      html
                  )
              ):
                  if not _SRC_RE.search(
                      match.group(
                          "attrs"
                      )
                      or ""
                  ):
                      fragments.append(
                          match.group(
                              "body"
                          )
                          or ""
                      )

              for match in (
                  _EVENT_RE.finditer(
                      html
                  )
              ):
                  fragments.append(
                      match.group(0)
                  )

              return fragments


          def inspect_active_logic(
              html: str,
          ) -> dict[str, int]:
              inline_scripts = 0
              external_scripts = 0

              for match in (
                  _SCRIPT_RE.finditer(
                      html
                  )
              ):
                  if _SRC_RE.search(
                      match.group(
                          "attrs"
                      )
                      or ""
                  ):
                      external_scripts += 1
                  else:
                      inline_scripts += 1

              return {
                  "inline_script_count": (
                      inline_scripts
                  ),
                  "external_script_count": (
                      external_scripts
                  ),
                  "inline_event_handler_count": (
                      len(
                          _EVENT_RE.findall(
                              html
                          )
                      )
                  ),
              }


          def scan_production_forbidden_logic(
              html: str,
          ) -> list[str]:
              active = "\n".join(
                  active_logic_fragments(
                      html
                  )
              )

              hits: list[str] = []

              for pattern in (
                  PRODUCTION_FORBIDDEN_PATTERNS
              ):
                  if re.search(
                      pattern,
                      active,
                      flags=(
                          re.I
                          | re.S
                      ),
                  ):
                      hits.append(
                          pattern
                      )

              return hits


          def validate_production_html(
              html: str,
          ) -> dict[str, Any]:
              report = (
                  validate_canonical_shell(
                      html
                  )
              )

              active = inspect_active_logic(
                  html
              )

              if active[
                  "inline_script_count"
              ]:
                  raise UIContractError(
                      "production HTML must not "
                      "contain inline script"
                  )

              if active[
                  "inline_event_handler_count"
              ]:
                  raise UIContractError(
                      "production HTML must not "
                      "contain inline event handlers"
                  )

              hits = (
                  scan_production_forbidden_logic(
                      html
                  )
              )

              if hits:
                  raise UIContractError(
                      "legacy/forbidden "
                      "production logic found: "
                      f"{hits}"
                  )

              return {
                  **report,
                  **active,
              }


          def display_value(
              value: Any,
              *,
              decimals: int | None = None,
          ) -> str:
              if (
                  value is None
                  or value == ""
              ):
                  return "—"

              if isinstance(
                  value,
                  bool,
              ):
                  return (
                      "true"
                      if value
                      else "false"
                  )

              if isinstance(
                  value,
                  float,
              ):
                  if (
                      value != value
                      or value
                      in (
                          float("inf"),
                          float("-inf"),
                      )
                  ):
                      return "—"

              if (
                  isinstance(
                      value,
                      (int, float),
                  )
                  and decimals
                  is not None
              ):
                  return (
                      f"{float(value):."
                      f"{decimals}f}"
                  )

              return str(value)
          V38V9_0

          cat > src/v38/site_builder.py <<'V38V9_1'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          from .ui_contract import (
              EXPECTED_TABS,
              validate_canonical_shell,
              validate_production_html,
          )

          CALCULATION_VERSION = (
              "v38-safe-site-builder-1.0.0"
          )

          CANONICAL_BLOB_SHA = (
              "966fe157e3d35344f6e373877b3de5689409dd67"
          )

          CANONICAL_SIZE = 1412062

          _SCRIPT_RE = re.compile(
              (
                  r"<script\b[^>]*>"
                  r".*?"
                  r"</script\s*>"
              ),
              re.I | re.S,
          )

          _EVENT_RE = re.compile(
              (
                  r"\s+on[a-zA-Z0-9_-]+"
                  r"\s*=\s*"
                  r"(?:"
                  r"\"[^\"]*\""
                  r"|'[^']*'"
                  r"|[^\s>]+"
                  r")"
              ),
              re.I | re.S,
          )

          _STYLE_RE = re.compile(
              (
                  r"<style\b[^>]*>"
                  r".*?"
                  r"</style\s*>"
              ),
              re.I | re.S,
          )

          _BODY_RE = re.compile(
              (
                  r"<body\b"
                  r"(?P<attrs>[^>]*)>"
              ),
              re.I | re.S,
          )

          _HEAD_END_RE = re.compile(
              r"</head\s*>",
              re.I,
          )

          _BODY_END_RE = re.compile(
              r"</body\s*>",
              re.I,
          )

          SECTION_IDS = tuple(
              href[1:]
              for _, href
              in EXPECTED_TABS
          )

          SHIELD_STYLE = """<style id="v38-production-shield">
          body[data-v38-production="shielded"] #t-market > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-alloc > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-port > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-rotation > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-rs > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-weekly > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-options > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-post1 > :not(.v38-production-state),
          body[data-v38-production="shielded"] #t-rules > :not(.v38-production-state){visibility:hidden!important}
          .v38-production-state{visibility:visible!important;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:5px}
          .v38-production-state b{font-size:14px}
          .v38-production-state span{font-size:11px;opacity:.75}
          </style>"""

          RUNTIME_SCRIPTS = (
              '<script '
              'src="assets/v38-runtime.js" '
              'defer></script>\n'
              '<script '
              'src="assets/v38-site.js" '
              'defer></script>'
          )


          class SiteBuildError(
              RuntimeError
          ):
              pass


          def git_blob_sha(
              data: bytes,
          ) -> str:
              header = (
                  f"blob {len(data)}\0"
              ).encode(
                  "ascii"
              )

              return hashlib.sha1(
                  header + data
              ).hexdigest()


          def canonical_fingerprint(
              data: bytes,
          ) -> dict[str, object]:
              return {
                  "size": len(data),
                  "blob_sha": (
                      git_blob_sha(
                          data
                      )
                  ),
              }


          def verify_canonical_bytes(
              data: bytes,
          ) -> None:
              fp = canonical_fingerprint(
                  data
              )

              if (
                  fp["size"]
                  != CANONICAL_SIZE
              ):
                  raise SiteBuildError(
                      "canonical size mismatch: "
                      f"{fp['size']} != "
                      f"{CANONICAL_SIZE}"
                  )

              if (
                  fp["blob_sha"]
                  != CANONICAL_BLOB_SHA
              ):
                  raise SiteBuildError(
                      "canonical blob mismatch: "
                      f"{fp['blob_sha']} != "
                      f"{CANONICAL_BLOB_SHA}"
                  )


          def _style_blocks(
              html: str,
          ) -> tuple[str, ...]:
              return tuple(
                  _STYLE_RE.findall(
                      html
                  )
              )


          def _strip_active_inline_logic(
              html: str,
          ) -> str:
              without_scripts = (
                  _SCRIPT_RE.sub(
                      "",
                      html,
                  )
              )

              return _EVENT_RE.sub(
                  "",
                  without_scripts,
              )


          def _mark_body_shielded(
              html: str,
          ) -> str:
              match = _BODY_RE.search(
                  html
              )

              if not match:
                  raise SiteBuildError(
                      "canonical body element "
                      "is missing"
                  )

              attrs = (
                  match.group(
                      "attrs"
                  )
                  or ""
              )

              if (
                  "data-v38-production"
                  in attrs
              ):
                  raise SiteBuildError(
                      "canonical unexpectedly "
                      "already contains "
                      "production marker"
                  )

              replacement = (
                  '<body '
                  'data-v38-production="shielded"'
                  f"{attrs}>"
              )

              return (
                  html[
                      : match.start()
                  ]
                  + replacement
                  + html[
                      match.end() :
                  ]
              )


          def _insert_section_state(
              html: str,
              section_id: str,
          ) -> str:
              pattern = re.compile(
                  (
                      r"(<section\b"
                      r"(?=[^>]*\bid\s*=\s*"
                      r"[\"']"
                      + re.escape(
                          section_id
                      )
                      + r"[\"'])"
                      r"[^>]*>)"
                  ),
                  re.I | re.S,
              )

              state = (
                  '<div '
                  'class="card '
                  'v38-production-state" '
                  'role="status" '
                  'data-v38-section="'
                  f"{section_id}"
                  '">'
                  '<b>DATA_REQUIRED</b>'
                  '<span>'
                  'Authoritative data binding '
                  'is not ready. '
                  'Mock values are shielded.'
                  '</span>'
                  '</div>'
              )

              out, count = (
                  pattern.subn(
                      lambda m: (
                          m.group(1)
                          + state
                      ),
                      html,
                      count=1,
                  )
              )

              if count != 1:
                  raise SiteBuildError(
                      "section insertion "
                      "failed: "
                      f"{section_id}"
                  )

              return out


          def build_safe_shell(
              canonical_html: str,
          ) -> str:
              validate_canonical_shell(
                  canonical_html
              )

              original_styles = (
                  _style_blocks(
                      canonical_html
                  )
              )

              out = (
                  _strip_active_inline_logic(
                      canonical_html
                  )
              )

              out = _mark_body_shielded(
                  out
              )

              for section_id in (
                  SECTION_IDS
              ):
                  out = (
                      _insert_section_state(
                          out,
                          section_id,
                      )
                  )

              if not _HEAD_END_RE.search(
                  out
              ):
                  raise SiteBuildError(
                      "head end tag is missing"
                  )

              out = _HEAD_END_RE.sub(
                  (
                      SHIELD_STYLE
                      + "\n</head>"
                  ),
                  out,
                  count=1,
              )

              if not _BODY_END_RE.search(
                  out
              ):
                  raise SiteBuildError(
                      "body end tag is missing"
                  )

              out = _BODY_END_RE.sub(
                  (
                      RUNTIME_SCRIPTS
                      + "\n</body>"
                  ),
                  out,
                  count=1,
              )

              generated_styles = tuple(
                  block
                  for block
                  in _style_blocks(
                      out
                  )
                  if (
                      'id="v38-production-shield"'
                      not in block
                  )
              )

              if (
                  generated_styles
                  != original_styles
              ):
                  raise SiteBuildError(
                      "canonical style blocks "
                      "changed during build"
                  )

              report = (
                  validate_production_html(
                      out
                  )
              )

              if (
                  report[
                      "external_script_count"
                  ]
                  != 2
              ):
                  raise SiteBuildError(
                      "production HTML must "
                      "contain exactly two "
                      "external scripts"
                  )

              if (
                  out.count(
                      'class="card '
                      'v38-production-state"'
                  )
                  != len(
                      SECTION_IDS
                  )
              ):
                  raise SiteBuildError(
                      "all nine sections "
                      "must be fail-closed "
                      "shielded"
                  )

              if (
                  'data-v38-production="shielded"'
                  not in out
              ):
                  raise SiteBuildError(
                      "production shield "
                      "marker missing"
                  )

              return out


          def build_site(
              canonical_path: str | Path,
              output_path: str | Path,
          ) -> Path:
              src = Path(
                  canonical_path
              )

              raw = src.read_bytes()

              verify_canonical_bytes(
                  raw
              )

              try:
                  html = raw.decode(
                      "utf-8"
                  )

              except UnicodeDecodeError as exc:
                  raise SiteBuildError(
                      "canonical must be UTF-8"
                  ) from exc

              out_html = build_safe_shell(
                  html
              )

              dst = Path(
                  output_path
              )

              dst.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              dst.write_text(
                  out_html,
                  encoding="utf-8",
              )

              return dst
          V38V9_1

          cat > scripts/build_site.py <<'V38V9_2'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path

          from v38.site_builder import (
              CANONICAL_BLOB_SHA,
              CANONICAL_SIZE,
              build_site,
          )

          from v38.ui_contract import (
              validate_production_html,
          )


          def main() -> int:
              p = argparse.ArgumentParser(
                  description=(
                      "Build fail-closed V38 "
                      "production shell from "
                      "canonical v5"
                  )
              )

              p.add_argument(
                  "--canonical",
                  default=(
                      "V38_Command_Center_mock_v5.html"
                  ),
              )

              p.add_argument(
                  "--output",
                  default="index.html",
              )

              args = p.parse_args()

              out = build_site(
                  args.canonical,
                  args.output,
              )

              report = (
                  validate_production_html(
                      out.read_text(
                          encoding="utf-8"
                      )
                  )
              )

              print(
                  json.dumps(
                      {
                          "status": (
                              "SAFE_SHELL_READY"
                          ),
                          "output": str(
                              out
                          ),
                          "canonical_blob_sha": (
                              CANONICAL_BLOB_SHA
                          ),
                          "canonical_size": (
                              CANONICAL_SIZE
                          ),
                          "tabs": [
                              label
                              for label, _
                              in report["tabs"]
                          ],
                          "inline_script_count": (
                              report[
                                  "inline_script_count"
                              ]
                          ),
                          "inline_event_handler_count": (
                              report[
                                  "inline_event_handler_count"
                              ]
                          ),
                          "external_script_count": (
                              report[
                                  "external_script_count"
                              ]
                          ),
                          "mock_values_shielded": (
                              True
                          ),
                      },
                      ensure_ascii=False,
                      sort_keys=True,
                  )
              )

              return 0


          if __name__ == "__main__":
              raise SystemExit(
                  main()
              )
