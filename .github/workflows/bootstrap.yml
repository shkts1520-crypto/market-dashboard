        run: |
          set -euo pipefail
          printf '%s' "$V38_DIAGNOSTICS_PAYLOAD_B64" | base64 -d > /tmp/v38-diagnostics-v3.tar.gz
          echo "f7a28caed4d99957c288d8714b46d9ed4dd1f331a9f0d390fdf3a378677169a0  /tmp/v38-diagnostics-v3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v38-diagnostics-v3.tar.gz -C .

      - name: Guard production and workflow files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/workflows; then
            echo "::error::Workflow files were modified by diagnostics payload"
            git diff -- .github/workflows
            exit 1
          fi

          FORBIDDEN=(
            data/rs.json
            data/breadth.json
            data/f123.json
            data/market_state.json
            data/core12.json
          )
          for path in "${FORBIDDEN[@]}"; do
            if ! git diff --quiet -- "$path"; then
              echo "::error::Production shard modified: $path"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate full recovered suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest
          PYTHONPATH=src pytest -q
          COUNT="$(PYTHONPATH=src pytest --collect-only -q | tail -1 | awk '{print $1}')"
          if [ "$COUNT" != "73" ]; then
            echo "::error::Expected 73 tests, collected $COUNT"
            exit 1
          fi
          python -m compileall -q src scripts

      - name: Commit diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf scripts/__pycache__ src/v38/__pycache__ tests/__pycache__ src/*.egg-info

          git add -- \
            src/v38/nqsar_engine.py \
            src/v38/mc57_engine.py \
            src/v38/diagnostics.py \
            src/v38/reference_gates.py \
            scripts/calculate_diagnostics.py \
            tests/test_nqsar_engine.py \
            tests/test_mc57_engine.py \
            tests/test_diagnostics.py \
            tests/test_reference_gates.py \
            docs/DIAGNOSTICS.md

          STAGED="$(git diff --cached --name-only)"
          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow modification staged"
            exit 1
          fi
          if printf '%s\n' "$STAGED" | grep -Eq '^data/(rs|breadth|f123|market_state|core12)\.json$'; then
            echo "::error::Production shard modification staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Diagnostics v3 already installed; no changes to commit."
            exit 0
          fi

          git commit -m "Add isolated V38 NQSAR MC57 diagnostics and readiness gates"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "V38 diagnostics v3 pushed to main."
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed"
              exit 1
            fi
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
