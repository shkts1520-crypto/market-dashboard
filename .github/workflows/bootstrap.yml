name: Verify V38 Canonical Live UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Verify canonical and live binding shell
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          python -m compileall -q src scripts
          node --check assets/v38-runtime.js
          node --check assets/v38-site.js
          test "$(git hash-object V38_Command_Center_mock_v5.html)" = "966fe157e3d35344f6e373877b3de5689409dd67"
          test "$(wc -c < V38_Command_Center_mock_v5.html | tr -d '[:space:]')" = "1412062"
          PYTHONPATH=src python scripts/build_site.py \
            --canonical V38_Command_Center_mock_v5.html \
            --output "$RUNNER_TEMP/index.html"
          grep -q 'data-v38-production="live-binding"' "$RUNNER_TEMP/index.html"
          ! grep -q 'v38-production-state' "$RUNNER_TEMP/index.html"
          ! grep -q 'visibility:hidden!important' "$RUNNER_TEMP/index.html"
          git diff --exit-code -- V38_Command_Center_mock_v5.html
