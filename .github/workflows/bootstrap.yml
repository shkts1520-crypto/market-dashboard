name: Install V38 Reference Recovery v6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diagnostics baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f src/v38/nqsar_engine.py
          test -f src/v38/mc57_engine.py
          test -f src/v38/reference_gates.py
          test -f tests/test_nqsar_engine.py

      - name: Write reference recovery files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/v38 tests docs

          cat > src/v38/nqsar_engine.py <<'V38REF_0'
          from __future__ import annotations

          from datetime import date, datetime
          import json
          import re
          from typing import Any, Mapping

          from .reference_gates import DATA_REQUIRED, nqsar_reference_gate

          CALCULATION_VERSION = "v38-nqsar-diagnostics-1.1.0"
          SCHEMA_VERSION = "v38.nqsar.readiness.1"
          VALID_STATES = {"Blue", "Green", "Yellow", "Red"}

          AUTHORITATIVE_SOURCE_PRIORITY = (
              "sar_state.txt",
              "EXP_STATE_ID",
          )

          EXP_STATE_ID_TO_STATE = {
              1: "Blue",
              2: "Yellow",
              3: "Red",
              4: "Green",
          }

          NQSAR_SPEC = {
              "inputs": ["NQ", "PSAR", "EMA21", "WILDER_RSI14"],
              "psar": {"step": 0.02, "increment": 0.02, "max": 0.08},
              "ema": {"span": 21, "adjust": False},
              "rsi": {"period": 14, "method": "Wilder"},
              "states": ["Blue", "Green", "Yellow", "Red"],
              "completed_bar_only": True,
              "exact_fsm_required": True,
          }


          class NQSARError(RuntimeError):
              """Raised when an NQSAR diagnostics or authoritative-input contract is invalid."""


          def validate_state(state: Any) -> str:
              if state not in VALID_STATES:
                  raise NQSARError("state must be one of Blue/Green/Yellow/Red")
              return str(state)


          def _parse_iso_date(value: Any, field: str) -> date:
              if not isinstance(value, str) or not value.strip():
                  raise NQSARError(f"{field} is required")
              text = value.strip()
              try:
                  parsed = date.fromisoformat(text)
              except ValueError as exc:
                  raise NQSARError(f"{field} must be YYYY-MM-DD") from exc
              if parsed.isoformat() != text:
                  raise NQSARError(f"{field} must be YYYY-MM-DD")
              return parsed


          def _parse_aware_datetime(value: Any, field: str) -> datetime:
              if not isinstance(value, str) or not value.strip():
                  raise NQSARError(f"{field} is required")
              text = value.strip()
              normalized = text[:-1] + "+00:00" if text.endswith("Z") else text
              try:
                  parsed = datetime.fromisoformat(normalized)
              except ValueError as exc:
                  raise NQSARError(f"{field} must be an ISO-8601 datetime") from exc
              if parsed.utcoffset() is None:
                  raise NQSARError(f"{field} must include a timezone offset")
              return parsed


          def _normalize_recovered_color(value: Any) -> str | None:
              if value is None:
                  return None
              text = str(value).strip()
              if not text:
                  return None
              normalized = text[:1].upper() + text[1:].lower()
              return normalized if normalized in VALID_STATES else None


          def parse_sar_state_text(
              raw: str,
              *,
              generated_at: str,
              expected_session_date: str,
              as_of: str,
              source: str = "sar_state.txt",
          ) -> dict[str, Any]:
              """Parse the recovered dated sar_state.txt formats and fail closed.

              Recovered accepted shapes are a JSON object carrying color/state/sar plus
              asof/date/session, or CSV-ish/plain text containing one YYYY-MM-DD date
              and one Blue/Green/Yellow/Red token. An embedded date is mandatory.
              """
              text = (raw or "").strip()
              if not text:
                  raise NQSARError("sar_state text is empty")

              state: str | None = None
              session_date: str | None = None

              try:
                  obj = json.loads(text)
              except Exception:
                  obj = None

              if isinstance(obj, dict):
                  state = _normalize_recovered_color(
                      obj.get("color") or obj.get("state") or obj.get("sar")
                  )
                  raw_date = obj.get("asof") or obj.get("date") or obj.get("session")
                  if raw_date is not None:
                      session_date = str(raw_date).strip()
              else:
                  date_match = re.search(r"([0-9]{4}-[0-9]{2}-[0-9]{2})", text)
                  color_match = re.search(r"\b(Blue|Green|Yellow|Red)\b", text, re.I)
                  if date_match:
                      session_date = date_match.group(1)
                  if color_match:
                      state = _normalize_recovered_color(color_match.group(1))

              if state is None:
                  raise NQSARError("sar_state text has no valid state")
              if not session_date:
                  raise NQSARError("sar_state text has no embedded session date")

              return parse_authoritative_input(
                  {
                      "session_date": session_date,
                      "generated_at": generated_at,
                      "source": source,
                      "state": state,
                  },
                  expected_session_date=expected_session_date,
                  as_of=as_of,
              )


          def readiness(
              *,
              session_date: str,
              generated_at: str,
              reference: dict[str, Any] | None = None,
          ) -> dict[str, Any]:
              if not session_date:
                  raise NQSARError("session_date is required")
              if not generated_at:
                  raise NQSARError("generated_at is required")

              gate = nqsar_reference_gate(reference)
              return {
                  "session_date": session_date,
                  "generated_at": generated_at,
                  "coverage": None,
                  "source": "reference-gate:nqsar",
                  "schema_version": SCHEMA_VERSION,
                  "calculation_version": CALCULATION_VERSION,
                  "status": gate.status,
                  "state": None,
                  "data_required": gate.as_dict()["missing"],
                  "spec": NQSAR_SPEC,
                  "reason": (
                      "Exact NQSAR FSM/golden fixture is not frozen; production state must not be inferred."
                      if gate.status == DATA_REQUIRED
                      else "Reference package is present; exact FSM implementation may be validated against it."
                  ),
              }


          def authoritative_state(
              state: Any,
              *,
              session_date: str,
              generated_at: str,
              source: str,
          ) -> dict[str, Any]:
              if not source:
                  raise NQSARError("authoritative source is required")
              return {
                  "session_date": session_date,
                  "generated_at": generated_at,
                  "coverage": 1.0,
                  "source": source,
                  "schema_version": "v38.nqsar.1",
                  "calculation_version": CALCULATION_VERSION,
                  "status": "AUTHORITATIVE_INPUT",
                  "state": validate_state(state),
              }


          def parse_authoritative_input(
              record: Mapping[str, Any],
              *,
              expected_session_date: str,
              as_of: str,
          ) -> dict[str, Any]:
              """Validate a direct NQSAR label without reconstructing or inferring the FSM."""
              if not isinstance(record, Mapping):
                  raise NQSARError("authoritative input must be a mapping")

              expected = _parse_iso_date(expected_session_date, "expected_session_date")
              session = _parse_iso_date(record.get("session_date"), "session_date")
              if session != expected:
                  relation = "stale" if session < expected else "future"
                  raise NQSARError(
                      f"{relation} session_date: expected {expected.isoformat()}, got {session.isoformat()}"
                  )

              generated = _parse_aware_datetime(record.get("generated_at"), "generated_at")
              cutoff = _parse_aware_datetime(as_of, "as_of")
              if generated > cutoff:
                  raise NQSARError("generated_at is in the future relative to as_of")

              source_value = record.get("source")
              if not isinstance(source_value, str) or not source_value.strip():
                  raise NQSARError("source is required")
              source = source_value.strip()

              has_state = record.get("state") not in (None, "")
              has_exp_id = record.get("exp_state_id") not in (None, "")
              if not has_state and not has_exp_id:
                  raise NQSARError("authoritative input requires state or exp_state_id")

              state_from_label: str | None = None
              if has_state:
                  state_from_label = validate_state(record.get("state"))

              state_from_id: str | None = None
              exp_state_id: int | None = None
              if has_exp_id:
                  raw_id = record.get("exp_state_id")
                  if isinstance(raw_id, bool) or not isinstance(raw_id, int):
                      raise NQSARError("exp_state_id must be an integer 1..4")
                  if raw_id not in EXP_STATE_ID_TO_STATE:
                      raise NQSARError("exp_state_id must be one of 1,2,3,4")
                  exp_state_id = raw_id
                  state_from_id = EXP_STATE_ID_TO_STATE[raw_id]

              if state_from_label is not None and state_from_id is not None:
                  if state_from_label != state_from_id:
                      raise NQSARError("state conflicts with exp_state_id")

              state = state_from_label or state_from_id
              if state is None:
                  raise NQSARError("authoritative state is unavailable")

              out = authoritative_state(
                  state,
                  session_date=session.isoformat(),
                  generated_at=record["generated_at"].strip(),
                  source=source,
              )
              out["input_kind"] = (
                  "state"
                  if state_from_label is not None
                  else "EXP_STATE_ID"
              )
              if exp_state_id is not None:
                  out["exp_state_id"] = exp_state_id
              return out
          V38REF_0

          cat > tests/test_nqsar_engine.py <<'V38REF_1'
          import pytest

          from v38.nqsar_engine import (
              EXP_STATE_ID_TO_STATE,
              NQSARError,
              NQSAR_SPEC,
              authoritative_state,
              parse_authoritative_input,
              parse_sar_state_text,
              readiness,
              validate_state,
          )

          SESSION = "2026-09-08"
          GENERATED = "2026-09-10T19:00:00+09:00"


          def test_readiness_is_data_required_without_exact_fsm_reference():
              out = readiness(
                  session_date=SESSION,
                  generated_at=GENERATED,
              )
              assert out["status"] == "DATA_REQUIRED"
              assert out["state"] is None


          def test_partial_reference_does_not_unlock_nqsar():
              out = readiness(
                  session_date=SESSION,
                  generated_at=GENERATED,
                  reference={
                      "verified": True,
                      "fsm_version": "v1",
                  },
              )
              assert out["status"] == "DATA_REQUIRED"
              assert (
                  "GOLDEN_FIXTURE_SHA256"
                  in out["data_required"]
              )


          def test_complete_reference_reports_ready_but_does_not_invent_state():
              out = readiness(
                  session_date=SESSION,
                  generated_at=GENERATED,
                  reference={
                      "verified": True,
                      "fsm_version": "v1",
                      "golden_fixture_sha256": "abc",
                  },
              )
              assert out["status"] == "READY"
              assert out["state"] is None


          def test_state_validation_accepts_only_four_canonical_states():
              for state in (
                  "Blue",
                  "Green",
                  "Yellow",
                  "Red",
              ):
                  assert validate_state(state) == state

              with pytest.raises(NQSARError):
                  validate_state("BLUE")


          def test_known_nqsar_indicator_parameters_are_frozen():
              assert NQSAR_SPEC["psar"] == {
                  "step": 0.02,
                  "increment": 0.02,
                  "max": 0.08,
              }
              assert NQSAR_SPEC["ema"] == {
                  "span": 21,
                  "adjust": False,
              }
              assert NQSAR_SPEC["rsi"] == {
                  "period": 14,
                  "method": "Wilder",
              }


          def test_authoritative_state_requires_source_and_preserves_session():
              with pytest.raises(NQSARError):
                  authoritative_state(
                      "Blue",
                      session_date=SESSION,
                      generated_at=GENERATED,
                      source="",
                  )

              out = authoritative_state(
                  "Green",
                  session_date=SESSION,
                  generated_at=GENERATED,
                  source="golden-fixture",
              )

              assert out["state"] == "Green"
              assert out["session_date"] == SESSION
              assert out["source"] == "golden-fixture"


          @pytest.mark.parametrize(
              ("exp_state_id", "expected"),
              sorted(EXP_STATE_ID_TO_STATE.items()),
          )
          def test_parse_authoritative_exp_state_ids(
              exp_state_id,
              expected,
          ):
              out = parse_authoritative_input(
                  {
                      "session_date": SESSION,
                      "generated_at": "2026-09-08T16:05:00-04:00",
                      "source": "NQ.csv:EXP_STATE_ID",
                      "exp_state_id": exp_state_id,
                  },
                  expected_session_date=SESSION,
                  as_of=GENERATED,
              )

              assert out["state"] == expected
              assert out["exp_state_id"] == exp_state_id
              assert out["input_kind"] == "EXP_STATE_ID"


          @pytest.mark.parametrize(
              "bad_session",
              [
                  "2026-09-07",
                  "2026-09-09",
              ],
          )
          def test_parse_authoritative_input_rejects_stale_or_future_session(
              bad_session,
          ):
              with pytest.raises(NQSARError):
                  parse_authoritative_input(
                      {
                          "session_date": bad_session,
                          "generated_at": "2026-09-08T16:05:00-04:00",
                          "source": "sar_state.txt",
                          "state": "Blue",
                      },
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )


          def test_parse_authoritative_input_rejects_missing_future_and_conflicting_metadata():
              with pytest.raises(NQSARError):
                  parse_authoritative_input(
                      {
                          "generated_at": "2026-09-08T16:05:00-04:00",
                          "source": "sar_state.txt",
                          "state": "Blue",
                      },
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )

              with pytest.raises(NQSARError):
                  parse_authoritative_input(
                      {
                          "session_date": SESSION,
                          "generated_at": "2026-09-11T00:00:00+09:00",
                          "source": "sar_state.txt",
                          "state": "Blue",
                      },
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )

              with pytest.raises(NQSARError):
                  parse_authoritative_input(
                      {
                          "session_date": SESSION,
                          "generated_at": "2026-09-08T16:05:00-04:00",
                          "source": "NQ.csv:EXP_STATE_ID",
                          "state": "Blue",
                          "exp_state_id": 3,
                      },
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )


          def test_parse_sar_state_text_accepts_recovered_json_aliases():
              samples = [
                  '{"asof":"2026-09-08","color":"blue"}',
                  '{"date":"2026-09-08","state":"Green"}',
                  '{"session":"2026-09-08","sar":"YELLOW"}',
              ]

              expected = [
                  "Blue",
                  "Green",
                  "Yellow",
              ]

              for raw, state in zip(
                  samples,
                  expected,
                  strict=True,
              ):
                  out = parse_sar_state_text(
                      raw,
                      generated_at="2026-09-08T16:05:00-04:00",
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )

                  assert out["state"] == state
                  assert out["source"] == "sar_state.txt"


          def test_parse_sar_state_text_accepts_recovered_csvish_format():
              out = parse_sar_state_text(
                  "2026-09-08,Red",
                  generated_at="2026-09-08T16:05:00-04:00",
                  expected_session_date=SESSION,
                  as_of=GENERATED,
              )

              assert out["state"] == "Red"
              assert out["session_date"] == SESSION


          def test_parse_sar_state_text_rejects_undated_stale_and_future_text():
              with pytest.raises(NQSARError):
                  parse_sar_state_text(
                      "Blue",
                      generated_at="2026-09-08T16:05:00-04:00",
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )

              with pytest.raises(NQSARError):
                  parse_sar_state_text(
                      "2026-09-07,Blue",
                      generated_at="2026-09-08T16:05:00-04:00",
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )

              with pytest.raises(NQSARError):
                  parse_sar_state_text(
                      '{"asof":"2026-09-09","color":"Blue"}',
                      generated_at="2026-09-08T16:05:00-04:00",
                      expected_session_date=SESSION,
                      as_of=GENERATED,
                  )
          V38REF_1

          cat > docs/REFERENCE_RECOVERY.md <<'V38REF_2'
          # V38 Authoritative Reference Recovery

          Status date: 2026-09-10

          This document records only source hierarchy and contracts recovered from prior V38 materials. It does not promote reconstructed logic into production.

          ## NQSAR

          Recovered authoritative hierarchy:

          1. `sar_state.txt` produced by the TradingView -> Pipedream path is the preferred direct state source.
          2. `EXP_STATE_ID` in the NQ CSV is a deeper fallback direct label source.
          3. Reconstructed `_onimine_state` logic is research/recovery material only and is not authoritative production logic.

          Recovered `EXP_STATE_ID` mapping:

          - 1 = Blue
          - 2 = Yellow
          - 3 = Red
          - 4 = Green

          Known frozen indicator metadata remains:

          - instrument: NQ
          - PSAR step 0.02 / increment 0.02 / max 0.08
          - EMA21
          - Wilder RSI14
          - states: Blue / Green / Yellow / Red
          - completed bars only

          The exact authoritative FSM and golden fixture are still missing. Therefore the NQSAR readiness gate remains `DATA_REQUIRED` until a verified reference package supplies `fsm_version` and `golden_fixture_sha256`.

          `parse_authoritative_input()` validates already-authoritative labels only. It does not calculate PSAR, EMA, RSI, or state transitions. It rejects missing session metadata, stale/future session dates, future generation timestamps, missing sources, invalid state IDs, and conflicting state labels.

          Recovered production code also establishes the accepted dated `sar_state.txt` parsing contract. `parse_sar_state_text()` accepts:

          - JSON objects using `color` / `state` / `sar` and `asof` / `date` / `session` aliases.
          - CSV-ish/plain text containing a `YYYY-MM-DD` date and one Blue/Green/Yellow/Red token, including `2026-07-10,Blue`.

          Unlike the legacy compatibility path, the recovered production guard is kept fail-closed here: an embedded session date is mandatory. Undated plain-color files are not enabled.

          ## MC57

          The mathematical contract is frozen in `mc57_engine.py`, but the exact fixed 57-ETF universe and golden fixture remain unrecovered. No older MRI/MC15 ETF list is promoted or substituted.

          Required before MC57 can become `READY`:

          - verified exact 57 unique ETF tickers
          - authoritative source/provenance
          - golden fixture SHA-256

          Until then MC57 stays `DATA_REQUIRED` and production values remain null rather than guessed.

          ## Production safety

          This recovery work does not change Normal Stock, Panic Reset, TQQQ Panic, F1/F2/F3, portfolio allocation, exits, ranking, or any production shard. NQSAR and MC57 readiness gates are intentionally unchanged.
          V38REF_2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Validate full suite
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=src pytest -q

          COUNT="$(
            PYTHONPATH=src \
            pytest -o addopts='' --collect-only -q \
            | grep -c '::'
          )"

          echo "Collected tests: $COUNT"
          if [ "$COUNT" != "83" ]; then
            echo "::error::Expected exactly 83 tests, got $COUNT"
            exit 1
          fi

          python -m compileall -q src scripts

          TMP_DIAG="$RUNNER_TEMP/v38-reference-recovery-diagnostics"
          rm -rf "$TMP_DIAG"

          PYTHONPATH=src python scripts/calculate_diagnostics.py \
            --session-date 2026-09-08 \
            --generated-at 2026-09-10T19:00:00+09:00 \
            --output-dir "$TMP_DIAG"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = (
              Path(os.environ["RUNNER_TEMP"])
              / "v38-reference-recovery-diagnostics"
              / "diagnostics.json"
          )

          obj = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          assert obj["status"] == "DATA_REQUIRED"
          assert obj["production_ready"] is False
          assert set(
              obj["blocked_components"]
          ) == {
              "NQSAR",
              "MC57",
          }
          PY

          echo "83 tests passed."
          echo "compileall passed."
          echo "diagnostics fail-closed smoke passed."

      - name: Guard changed files
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type d \
            -name __pycache__ \
            -prune \
            -exec rm -rf {} +

          rm -rf \
            .pytest_cache \
            src/*.egg-info \
            *.egg-info

          ALLOWED_RE="^(src/v38/nqsar_engine\.py|tests/test_nqsar_engine\.py|docs/REFERENCE_RECOVERY\.md)$"

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            if ! printf '%s\n' "$path" \
              | grep -Eq "$ALLOWED_RE"
            then
              echo "::error::Unexpected changed file: $path"
              exit 1
            fi
          done <<< "$CHANGED"

          EXPECTED="$(
            printf '%s\n' \
              docs/REFERENCE_RECOVERY.md \
              src/v38/nqsar_engine.py \
              tests/test_nqsar_engine.py \
            | sort
          )"

          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "::error::Expected exactly three reference-recovery files"
            exit 1
          fi

          echo "Changed-file guard passed."

      - name: Commit reference recovery only
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            src/v38/nqsar_engine.py \
            tests/test_nqsar_engine.py \
            docs/REFERENCE_RECOVERY.md

          STAGED="$(
            git diff \
              --cached \
              --name-only \
            | sort
          )"

          EXPECTED="$(
            printf '%s\n' \
              docs/REFERENCE_RECOVERY.md \
              src/v38/nqsar_engine.py \
              tests/test_nqsar_engine.py \
            | sort
          )"

          echo "Staged files:"
          printf '%s\n' "$STAGED"

          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "::error::Unexpected staged file set"
            exit 1
          fi

          git commit \
            -m "Add strict NQSAR authoritative input recovery guard"

          git push origin HEAD:main
