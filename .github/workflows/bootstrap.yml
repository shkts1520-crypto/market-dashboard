              in html
          )
          PY

          echo "160 tests passed."
          echo "v9 safe shell acceptance passed."

      - name: Guard changed files
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type d \
            -name __pycache__ \
            -prune \
            -exec rm -rf {} +

          rm -rf \
            .pytest_cache \
            src/*.egg-info \
            *.egg-info

          EXPECTED="$(
            printf '%s\n' \
              assets/v38-site.js \
              docs/SITE_BUILD.md \
              index.html \
              scripts/build_site.py \
              src/v38/site_builder.py \
              src/v38/ui_contract.py \
              tests/test_site_builder.py \
              tests/test_ui_contract_v9.py \
            | sort
          )"

          CHANGED="$(
            {
              git diff --name-only
              git ls-files \
                --others \
                --exclude-standard
            } | sort -u
          )"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "::error::v9 changed-file set does not match exact 8-file allowlist"

            diff -u \
              <(
                printf '%s\n' \
                  "$EXPECTED"
              ) \
              <(
                printf '%s\n' \
                  "$CHANGED"
              ) \
              || true

            exit 1
          fi

          if ! git diff \
            --quiet \
            -- V38_Command_Center_mock_v5.html
          then
            echo "::error::Canonical v5 was modified"
            exit 1
          fi

          echo "v9 changed-file guard passed."

