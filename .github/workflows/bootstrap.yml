            echo "::error::Expected exactly 148 tests, got $COUNT"
            exit 1
          fi

          python -m compileall -q src scripts

          node --check \
            assets/v38-runtime.js

          python - <<'PY'
          from v38.freshness import (
              assess_shard_object,
          )
          from v38.ui_contract import (
