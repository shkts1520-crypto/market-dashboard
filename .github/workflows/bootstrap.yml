          assert (
              canonical_fingerprint(
                  canonical
              )
              == {
                  "size": CANONICAL_SIZE,
                  "blob_sha": CANONICAL_BLOB_SHA,
              }
          )

          html = Path(
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          report = (
              validate_production_html(
                  html
              )
          )

          assert (
              report[
                  "inline_script_count"
              ]
              == 0
          )

          assert (
              report[
                  "inline_event_handler_count"
              ]
              == 0
          )

          assert (
              report[
                  "external_script_count"
              ]
              == 2
          )

          assert (
              html.count(
                  'class="card '
                  'v38-production-state"'
              )
              == 9
          )

          assert (
              'data-v38-production="shielded"'
              in html
          )

          assert (
              (
                  '<script '
                  'src="assets/v38-runtime.js" '
                  'defer></script>'
              )
              in html
          )

          assert (
              (
                  '<script '
                  'src="assets/v38-site.js" '
                  'defer></script>'
