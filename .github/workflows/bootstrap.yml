name: Repair and Install V38 Safe UI Shell v9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Verify baseline and canonical
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          BASE_COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Baseline tests: $BASE_COUNT"
          [ "$BASE_COUNT" = "148" ] || { echo "::error::Expected 148 baseline tests"; exit 1; }
          test -f V38_Command_Center_mock_v5.html
          SHA="$(git hash-object V38_Command_Center_mock_v5.html)"
          SIZE="$(wc -c < V38_Command_Center_mock_v5.html | tr -d '[:space:]')"
          echo "Canonical blob SHA: $SHA"
          echo "Canonical bytes: $SIZE"
          [ "$SHA" = "966fe157e3d35344f6e373877b3de5689409dd67" ] || { echo "::error::Canonical SHA mismatch"; exit 1; }
          [ "$SIZE" = "1412062" ] || { echo "::error::Canonical size mismatch"; exit 1; }

      - name: Recover and repair v9 payload
        shell: bash
        run: |
          set -euo pipefail
          PREV="$(git rev-parse HEAD^)"
          git show "$PREV:.github/workflows/bootstrap.yml" > "$RUNNER_TEMP/v9-source.yml"

          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import textwrap

          src = Path(os.environ["RUNNER_TEMP"]) / "v9-source.yml"
          raw = src.read_text(encoding="utf-8")

          mapping = {
              "V38V9_0": "src/v38/ui_contract.py",
              "V38V9_1": "src/v38/site_builder.py",
              "V38V9_2": "scripts/build_site.py",
              "V38V9_3": "assets/v38-site.js",
              "V38V9_4": "tests/test_site_builder.py",
              "V38V9_5": "tests/test_ui_contract_v9.py",
              "V38V9_6": "docs/SITE_BUILD.md",
          }

          for marker, path in mapping.items():
              pattern = re.compile(
                  rf"^\s*cat > {re.escape(path)} <<'{marker}'\s*$\n(?P<body>.*?)^\s*{marker}\s*$",
                  re.M | re.S,
              )
              match = pattern.search(raw)
              if not match:
                  raise SystemExit(f"missing embedded payload: {marker} -> {path}")
              body = textwrap.dedent(match.group("body"))

              if path == "src/v38/ui_contract.py":
                  bad = re.compile(
                      r'return\s*\(\s*f"\{float\(value\):\."\s*f"\{decimals\}f\}"\s*\)',
                      re.S,
                  )
                  body, count = bad.subn(
                      'return f"{float(value):.{decimals}f}"',
                      body,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit("expected broken display_value f-string was not found exactly once")

              out = Path(path)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(body.rstrip() + "\n", encoding="utf-8")

          print("Recovered 7 v9 files and repaired exactly one f-string.")
          PY

          python -m py_compile src/v38/ui_contract.py src/v38/site_builder.py scripts/build_site.py
          node --check assets/v38-site.js

      - name: Build safe index
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/build_site.py \
            --canonical V38_Command_Center_mock_v5.html \
            --output index.html
          git diff --exit-code -- V38_Command_Center_mock_v5.html

      - name: Validate full v9 suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Collected tests: $COUNT"
          [ "$COUNT" = "160" ] || { echo "::error::Expected exactly 160 tests, got $COUNT"; exit 1; }
          python -m compileall -q src scripts
          node --check assets/v38-runtime.js
          node --check assets/v38-site.js
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from v38.site_builder import CANONICAL_BLOB_SHA, CANONICAL_SIZE, canonical_fingerprint
          from v38.ui_contract import validate_production_html

          canonical = Path("V38_Command_Center_mock_v5.html").read_bytes()
          assert canonical_fingerprint(canonical) == {
              "size": CANONICAL_SIZE,
              "blob_sha": CANONICAL_BLOB_SHA,
          }

          html = Path("index.html").read_text(encoding="utf-8")
          report = validate_production_html(html)

          assert report["inline_script_count"] == 0
          assert report["inline_event_handler_count"] == 0
          assert report["external_script_count"] == 2
          assert html.count('class="card v38-production-state"') == 9
          assert 'data-v38-production="shielded"' in html
          PY

          echo "v9 acceptance passed."

      - name: Guard changed files
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache src/*.egg-info *.egg-info

          EXPECTED="$(printf '%s\n' \
            assets/v38-site.js \
            docs/SITE_BUILD.md \
            index.html \
            scripts/build_site.py \
            src/v38/site_builder.py \
            src/v38/ui_contract.py \
            tests/test_site_builder.py \
            tests/test_ui_contract_v9.py | sort)"

          CHANGED="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "::error::Unexpected v9 changed-file set"
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$CHANGED") || true
            exit 1
          fi

          git diff --quiet -- V38_Command_Center_mock_v5.html || {
            echo "::error::Canonical modified"
            exit 1
          }

      - name: Commit and push v9
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            assets/v38-site.js \
            docs/SITE_BUILD.md \
            index.html \
            scripts/build_site.py \
            src/v38/site_builder.py \
            src/v38/ui_contract.py \
            tests/test_site_builder.py \
            tests/test_ui_contract_v9.py

          git commit -m "Build fail-closed V38 canonical UI shell"
          git push origin HEAD:main
