            scripts/build_site.py \
            src/v38/site_builder.py \
            src/v38/ui_contract.py \
            tests/test_site_builder.py \
            tests/test_ui_contract_v9.py

          STAGED="$(
            git diff \
              --cached \
              --name-only \
            | sort
          )"

          EXPECTED="$(
            printf '%s\n' \
              assets/v38-site.js \
              docs/SITE_BUILD.md \
              index.html \
              scripts/build_site.py \
              src/v38/site_builder.py \
              src/v38/ui_contract.py \
              tests/test_site_builder.py \
              tests/test_ui_contract_v9.py \
            | sort
          )"

          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "::error::Unexpected staged file set"

            diff -u \
              <(
                printf '%s\n' \
                  "$EXPECTED"
              ) \
              <(
                printf '%s\n' \
                  "$STAGED"
              ) \
              || true

            exit 1
