        run: |
          set -euo pipefail
          printf '%s' "$V38_PAYLOAD_B64" | base64 -d > /tmp/v38-bootstrap.tar.gz
          tar -xzf /tmp/v38-bootstrap.tar.gz -C .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate restored code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest
          pytest -q
          python -m compileall -q src scripts

      - name: Commit V38 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f data/bootstrap-status.txt
          rm -f .github/workflows/bootstrap.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Bootstrap verified V38 market dashboard implementation"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on origin/main"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
