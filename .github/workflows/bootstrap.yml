name: Install V38 Rule Engines v7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Verify v6 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/REFERENCE_RECOVERY.md
          grep -q 'v38-nqsar-diagnostics-1.1.0' src/v38/nqsar_engine.py
          PYTHONPATH=src pytest -q
          BASE_COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Baseline tests: $BASE_COUNT"
          if [ "$BASE_COUNT" != "83" ]; then
            echo "::error::Expected v6 baseline of exactly 83 tests, got $BASE_COUNT"
            exit 1
          fi

      - name: Write v7 rule engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/v38 tests

          cat > src/v38/calculate_pipeline.py <<'V38V7_0'
          from __future__ import annotations
          
          import json
          import math
          import os
          import shutil
          import tempfile
          from pathlib import Path
          from typing import Any
          
          from .f123_engine import calculate_f123_from_files
          from .market_engine import MarketEngineError, calculate_market_from_files
          from .nqsar_input import NQSARInputError, normalize_nqsar_file
          from .stock_adapter import calculate_from_files
          
          CALCULATION_VERSION = "v38-calculate-pipeline-1.1.0"
          REQUIRED_META = (
              "session_date",
              "generated_at",
              "coverage",
              "source",
              "schema_version",
              "calculation_version",
          )
          OUTPUT_NAMES = ("rs.json", "breadth.json", "f123.json", "market_state.json", "core12.json")
          
          
          class CalculatePipelineError(RuntimeError):
              """Raised when the staged calculate output fails its publication contract."""
          
          
          def _load(path: Path) -> dict[str, Any]:
              obj = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(obj, dict):
                  raise CalculatePipelineError(f"{path.name}: expected JSON object")
              return obj
          
          
          def _walk_finite(v: Any, path: str = "$") -> None:
              if isinstance(v, float) and not math.isfinite(v):
                  raise CalculatePipelineError(f"non-finite JSON number at {path}")
              if isinstance(v, dict):
                  for k, x in v.items():
                      _walk_finite(x, f"{path}.{k}")
              elif isinstance(v, list):
                  for i, x in enumerate(v):
                      _walk_finite(x, f"{path}[{i}]")
          
          
          def validate_staged_outputs(stage: str | Path, *, session_date: str, generated_at: str) -> dict[str, Any]:
              root = Path(stage)
              loaded: dict[str, Any] = {}
              for name in OUTPUT_NAMES:
                  p = root / name
                  if not p.exists():
                      raise CalculatePipelineError(f"missing staged output: {name}")
                  obj = _load(p)
                  missing = [k for k in REQUIRED_META if k not in obj]
                  if missing:
                      raise CalculatePipelineError(f"{name}: missing metadata: {', '.join(missing)}")
                  if obj["session_date"] != session_date:
                      raise CalculatePipelineError(
                          f"STALE staged session mismatch: {name}={obj['session_date']} target={session_date}"
                      )
                  if obj["generated_at"] != generated_at:
                      raise CalculatePipelineError(
                          f"generated_at mismatch: {name}={obj['generated_at']} target={generated_at}"
                      )
                  if not isinstance(obj.get("source"), str) or not obj["source"]:
                      raise CalculatePipelineError(f"{name}: source is required")
                  if not isinstance(obj.get("schema_version"), str) or not obj["schema_version"]:
                      raise CalculatePipelineError(f"{name}: schema_version is required")
                  if not isinstance(obj.get("calculation_version"), str) or not obj["calculation_version"]:
                      raise CalculatePipelineError(f"{name}: calculation_version is required")
                  _walk_finite(obj)
                  loaded[name] = obj
              return loaded
          
          
          def calculate_pipeline(
              *,
              ohlcv_path: str | Path,
              universe_path: str | Path,
              nqsar_path: str | Path,
              output_dir: str | Path,
              session_date: str,
              generated_at: str,
              stock_source: str,
              old_top24_path: str | Path | None = None,
              classifications_path: str | Path | None = None,
              theme_scores_path: str | Path | None = None,
          ) -> tuple[Path, ...]:
              """Run the auditable calculate slice, validate, then publish atomically.
          
              NQSAR may be a dated sar_state.txt, authoritative NQSAR JSON shard, or
              EXP_STATE_ID JSON record. It is normalized and freshness-checked before any
              market output can be published. The missing exact FSM is never reconstructed.
              """
              out = Path(output_dir)
              out.parent.mkdir(parents=True, exist_ok=True)
              stage = Path(tempfile.mkdtemp(prefix=".v38-calc-stage-", dir=out.parent))
              try:
                  try:
                      normalized_nqsar = normalize_nqsar_file(
                          nqsar_path,
                          stage / "_nqsar_authoritative.json",
                          expected_session_date=session_date,
                          as_of=generated_at,
                      )
                  except NQSARInputError as exc:
                      msg = str(exc)
                      if "stale session_date" in msg or "future session_date" in msg:
                          raise MarketEngineError(
                              f"STALE shard session mismatch: nqsar authoritative input rejected: {msg}"
                          ) from exc
                      raise MarketEngineError(f"NQSAR authoritative input rejected: {msg}") from exc
          
                  rs_path, breadth_path = calculate_from_files(
                      ohlcv_path,
                      universe_path,
                      stage,
                      session_date=session_date,
                      generated_at=generated_at,
                      source=stock_source,
                  )
                  calculate_f123_from_files(
                      rs_path,
                      stage / "f123.json",
                      generated_at=generated_at,
                      old_top24_path=old_top24_path,
                  )
                  calculate_market_from_files(
                      rs_path,
                      breadth_path,
                      normalized_nqsar,
                      stage,
                      generated_at=generated_at,
                      classifications_path=classifications_path,
                      theme_scores_path=theme_scores_path,
                  )
                  validate_staged_outputs(stage, session_date=session_date, generated_at=generated_at)
          
                  out.mkdir(parents=True, exist_ok=True)
                  published: list[Path] = []
                  for name in OUTPUT_NAMES:
                      src = stage / name
                      dst = out / name
                      os.replace(src, dst)
                      published.append(dst)
                  return tuple(published)
              finally:
                  shutil.rmtree(stage, ignore_errors=True)
          V38V7_0

          cat > src/v38/nqsar_input.py <<'V38V7_1'
          from __future__ import annotations
          
          import json
          import os
          import tempfile
          from pathlib import Path
          from typing import Any
          
          from .nqsar_engine import NQSARError, parse_authoritative_input, parse_sar_state_text
          
          CALCULATION_VERSION = "v38-nqsar-input-1.0.0"
          
          class NQSARInputError(RuntimeError):
              """Raised when an upstream NQSAR label cannot be normalized safely."""
          
          
          def _atomic_json(path: Path, obj: dict[str, Any]) -> Path:
              path.parent.mkdir(parents=True, exist_ok=True)
              text = json.dumps(obj, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False) + "\n"
              fd, tmp = tempfile.mkstemp(prefix=path.name + ".", dir=path.parent)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(text)
                  os.replace(tmp, path)
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)
              return path
          
          
          def normalize_nqsar_text(
              raw: str,
              *,
              expected_session_date: str,
              as_of: str,
              source_name: str,
          ) -> dict[str, Any]:
              text = (raw or "").strip()
              if not text:
                  raise NQSARInputError("NQSAR input is empty")
          
              try:
                  parsed = json.loads(text)
              except json.JSONDecodeError:
                  parsed = None
          
              try:
                  if isinstance(parsed, dict):
                      if parsed.get("status") == "DATA_REQUIRED" and not parsed.get("state"):
                          raise NQSARInputError("NQSAR upstream is DATA_REQUIRED")
          
                      has_direct_contract = (
                          "session_date" in parsed
                          and "generated_at" in parsed
                          and "source" in parsed
                          and ("state" in parsed or "exp_state_id" in parsed)
                      )
                      if has_direct_contract:
                          out = parse_authoritative_input(
                              parsed,
                              expected_session_date=expected_session_date,
                              as_of=as_of,
                          )
                      else:
                          out = parse_sar_state_text(
                              text,
                              generated_at=as_of,
                              expected_session_date=expected_session_date,
                              as_of=as_of,
                              source=source_name,
                          )
                  else:
                      out = parse_sar_state_text(
                          text,
                          generated_at=as_of,
                          expected_session_date=expected_session_date,
                          as_of=as_of,
                          source=source_name,
                      )
              except NQSARError as exc:
                  raise NQSARInputError(str(exc)) from exc
          
              out["input_adapter_version"] = CALCULATION_VERSION
              return out
          
          
          def normalize_nqsar_file(
              input_path: str | Path,
              output_path: str | Path,
              *,
              expected_session_date: str,
              as_of: str,
          ) -> Path:
              src = Path(input_path)
              if not src.exists():
                  raise NQSARInputError(f"NQSAR input not found: {src}")
              out = normalize_nqsar_text(
                  src.read_text(encoding="utf-8"),
                  expected_session_date=expected_session_date,
                  as_of=as_of,
                  source_name=src.name,
              )
              return _atomic_json(Path(output_path), out)
          V38V7_1

          cat > src/v38/positions_engine.py <<'V38V7_2'
          from __future__ import annotations
          
          import math
          from typing import Any
          
          CALCULATION_VERSION = "v38-positions-rules-1.0.0"
          INITIAL_STOP_PCT = 0.92
          PARTIAL_TRIGGER_PCT = 1.24
          PARTIAL_SELL_FRACTION = 0.25
          WINNER_TRAIL_PCT = 0.70
          
          class PositionsRuleError(RuntimeError):
              pass
          
          
          def _positive(value: Any, field: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise PositionsRuleError(f"{field} must be a finite positive number")
              x = float(value)
              if not math.isfinite(x) or x <= 0:
                  raise PositionsRuleError(f"{field} must be a finite positive number")
              return x
          
          
          def stop_levels(*, entry: float, peak_close: float) -> dict[str, float]:
              e = _positive(entry, "entry")
              p = _positive(peak_close, "peak_close")
              if p < e:
                  raise PositionsRuleError("peak_close must be >= entry")
              initial = e * INITIAL_STOP_PCT
              trail = p * WINNER_TRAIL_PCT
              return {
                  "initial_stop": initial,
                  "winner_trail": trail,
                  "final_stop": max(initial, trail),
              }
          
          
          def normal_stock_next_open_action(
              *,
              entry: float,
              close: float,
              peak_close: float,
              partial_taken: bool,
              nqsar_state: str,
          ) -> dict[str, Any]:
              e = _positive(entry, "entry")
              c = _positive(close, "close")
              p = _positive(peak_close, "peak_close")
              if p < max(e, c):
                  raise PositionsRuleError("peak_close must be >= entry and close")
              if not isinstance(partial_taken, bool):
                  raise PositionsRuleError("partial_taken must be bool")
              if nqsar_state not in {"Blue", "Green", "Yellow", "Red"}:
                  raise PositionsRuleError("invalid NQSAR state")
          
              levels = stop_levels(entry=e, peak_close=p)
          
              if nqsar_state == "Red":
                  return {
                      "action": "EXIT_ALL_NEXT_OPEN",
                      "reason": "NQSAR_RED_PORTFOLIO_EXIT",
                      "sell_fraction": 1.0,
                      "levels": levels,
                  }
          
              active_stop = levels["final_stop"] if partial_taken else levels["initial_stop"]
              if c <= active_stop:
                  return {
                      "action": "EXIT_REMAINDER_NEXT_OPEN" if partial_taken else "EXIT_ALL_NEXT_OPEN",
                      "reason": "WINNER_TRAIL_OR_INITIAL_STOP" if partial_taken else "INITIAL_STOP_CLOSE",
                      "sell_fraction": 1.0,
                      "levels": levels,
                  }
          
              if not partial_taken and c >= e * PARTIAL_TRIGGER_PCT:
                  return {
                      "action": "SELL_25_PCT_NEXT_OPEN",
                      "reason": "FIRST_CLOSE_GE_ENTRY_X_1_24",
                      "sell_fraction": PARTIAL_SELL_FRACTION,
                      "levels": levels,
                  }
          
              return {
                  "action": "HOLD",
                  "reason": "NO_CONFIRMED_EXIT",
                  "sell_fraction": 0.0,
                  "levels": levels,
                  "yellow_forces_exit": False,
                  "breadth_forces_trim": False,
                  "rank_decline_exit": False,
                  "theme_decline_exit": False,
              }
          V38V7_2

          cat > src/v38/panic_reset_engine.py <<'V38V7_3'
          from __future__ import annotations
          
          import math
          from typing import Any
          
          CALCULATION_VERSION = "v38-panic-reset-rules-1.0.0"
          POSITION_PCT = 2.9
          MAX_TOTAL_SLOTS = 4
          MAX_SAME_THEME_SLOTS = 2
          HOLD_SESSIONS = 20
          COOLDOWN_SESSIONS = 20
          
          class PanicResetRuleError(RuntimeError):
              pass
          
          
          def _finite(value: Any, field: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise PanicResetRuleError(f"{field} must be finite")
              x = float(value)
              if not math.isfinite(x):
                  raise PanicResetRuleError(f"{field} must be finite")
              return x
          
          
          def activation(*, theme_rs_pct: float, rank_improvement_20d: float, theme_above_ema21_pct: float) -> bool:
              return bool(
                  _finite(theme_rs_pct, "theme_rs_pct") >= 80.0
                  and _finite(rank_improvement_20d, "rank_improvement_20d") >= 15.0
                  and _finite(theme_above_ema21_pct, "theme_above_ema21_pct") >= 60.0
              )
          
          
          def entry_signal(
              *,
              activation_ok: bool,
              rsi30_touched_within_20: bool,
              first_rsi_up_day_after_touch: bool,
              theme_rs63_rank: int,
          ) -> bool:
              if not all(isinstance(x, bool) for x in (activation_ok, rsi30_touched_within_20, first_rsi_up_day_after_touch)):
                  raise PanicResetRuleError("signal flags must be bool")
              if isinstance(theme_rs63_rank, bool) or not isinstance(theme_rs63_rank, int) or theme_rs63_rank < 1:
                  raise PanicResetRuleError("theme_rs63_rank must be a positive int")
              return bool(
                  activation_ok
                  and rsi30_touched_within_20
                  and first_rsi_up_day_after_touch
                  and theme_rs63_rank <= 3
              )
          
          
          def admission(
              *,
              signal: bool,
              current_total_slots: int,
              current_same_theme_slots: int,
              sessions_since_exit: int | None,
          ) -> dict[str, Any]:
              if not isinstance(signal, bool):
                  raise PanicResetRuleError("signal must be bool")
              for field, value in (
                  ("current_total_slots", current_total_slots),
                  ("current_same_theme_slots", current_same_theme_slots),
              ):
                  if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                      raise PanicResetRuleError(f"{field} must be a non-negative int")
              if sessions_since_exit is not None and (
                  isinstance(sessions_since_exit, bool)
                  or not isinstance(sessions_since_exit, int)
                  or sessions_since_exit < 0
              ):
                  raise PanicResetRuleError("sessions_since_exit must be non-negative int or None")
          
              if not signal:
                  return {"admit": False, "reason": "NO_ENTRY_SIGNAL", "position_pct": 0.0}
              if current_total_slots >= MAX_TOTAL_SLOTS:
                  return {"admit": False, "reason": "TOTAL_SLOT_CAP", "position_pct": 0.0}
              if current_same_theme_slots >= MAX_SAME_THEME_SLOTS:
                  return {"admit": False, "reason": "SAME_THEME_SLOT_CAP", "position_pct": 0.0}
              if sessions_since_exit is not None and sessions_since_exit < COOLDOWN_SESSIONS:
                  return {"admit": False, "reason": "COOLDOWN_20_SESSIONS", "position_pct": 0.0}
              return {"admit": True, "reason": "PANIC_RESET_ENTRY_NEXT_OPEN", "position_pct": POSITION_PCT}
          
          
          def holding_action(*, holding_sessions_completed: int) -> dict[str, Any]:
              if isinstance(holding_sessions_completed, bool) or not isinstance(holding_sessions_completed, int) or holding_sessions_completed < 0:
                  raise PanicResetRuleError("holding_sessions_completed must be non-negative int")
              if holding_sessions_completed >= HOLD_SESSIONS:
                  return {"action": "EXIT_NEXT_OPEN", "reason": "FIXED_20_SESSION_HOLD"}
              return {
                  "action": "HOLD",
                  "reason": "FIXED_HOLD_ACTIVE",
                  "initial_stop_enabled": False,
                  "averaging_enabled": False,
              }
          V38V7_3

          cat > src/v38/tqqq_engine.py <<'V38V7_4'
          from __future__ import annotations
          
          import math
          from typing import Any
          
          CALCULATION_VERSION = "v38-tqqq-panic-rules-1.1.0"
          BASE_TARGET_PCT = 30
          PANIC_TARGET_PCT = 80
          SEED_MAX_AGE_SESSIONS = 30
          PANIC_MAX_HOLD_SESSIONS = 10
          MC57_MIN_TRIGGER = 20.0
          
          class TQQQRuleError(RuntimeError):
              pass
          
          
          def _finite(value: Any, field: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise TQQQRuleError(f"{field} must be finite")
              x = float(value)
              if not math.isfinite(x):
                  raise TQQQRuleError(f"{field} must be finite")
              return x
          
          
          def panic_seed(*, vix_close: float, qqq_sma50_atr_deviation: float, qqq_dd10: float) -> bool:
              return bool(
                  _finite(vix_close, "vix_close") >= 23.0
                  and _finite(qqq_sma50_atr_deviation, "qqq_sma50_atr_deviation") <= -0.5
                  and _finite(qqq_dd10, "qqq_dd10") <= -0.02
              )
          
          
          def panic_trigger(
              *,
              seed_age_sessions: int | None,
              qqq_4h_rsi14: float,
              mc57: float | None,
          ) -> dict[str, Any]:
              if seed_age_sessions is None:
                  return {"status": "OK", "trigger": False, "reason": "NO_ACTIVE_SEED"}
              if isinstance(seed_age_sessions, bool) or not isinstance(seed_age_sessions, int):
                  raise TQQQRuleError("seed_age_sessions must be int or None")
              if seed_age_sessions < 0:
                  raise TQQQRuleError("seed_age_sessions must be >=0")
          
              rsi = _finite(qqq_4h_rsi14, "qqq_4h_rsi14")
              if seed_age_sessions > SEED_MAX_AGE_SESSIONS:
                  return {"status": "OK", "trigger": False, "reason": "SEED_EXPIRED"}
              if rsi > 30.0:
                  return {"status": "OK", "trigger": False, "reason": "QQQ_4H_RSI_ABOVE_30"}
              if mc57 is None:
                  return {
                      "status": "DATA_REQUIRED",
                      "trigger": None,
                      "reason": "MC57_REQUIRED_FOR_PANIC_TRIGGER",
                  }
          
              m = _finite(mc57, "mc57")
              return {
                  "status": "OK",
                  "trigger": m >= MC57_MIN_TRIGGER,
                  "reason": "TRIGGER_CONFIRMED" if m >= MC57_MIN_TRIGGER else "MC57_BELOW_20",
              }
          
          
          def panic_position_action(
              *,
              in_panic: bool,
              holding_sessions_completed: int,
              trigger: bool | None,
              mc57: float | None,
          ) -> dict[str, Any]:
              if not isinstance(in_panic, bool):
                  raise TQQQRuleError("in_panic must be bool")
              if trigger is not None and not isinstance(trigger, bool):
                  raise TQQQRuleError("trigger must be bool or None")
              if isinstance(holding_sessions_completed, bool) or not isinstance(holding_sessions_completed, int) or holding_sessions_completed < 0:
                  raise TQQQRuleError("holding_sessions_completed must be a non-negative int")
          
              if in_panic and holding_sessions_completed >= PANIC_MAX_HOLD_SESSIONS:
                  return {
                      "status": "OK",
                      "action": "RETURN_TO_30_NEXT_OPEN",
                      "target_pct": BASE_TARGET_PCT,
                      "reason": "PANIC_MAX_10_SESSIONS",
                  }
          
              if in_panic:
                  if mc57 is None:
                      return {
                          "status": "DATA_REQUIRED",
                          "action": None,
                          "target_pct": None,
                          "reason": "MC57_REQUIRED_FOR_EARLY_EXIT_CHECK",
                      }
                  m = _finite(mc57, "mc57")
                  if m < MC57_MIN_TRIGGER:
                      return {
                          "status": "OK",
                          "action": "RETURN_TO_30_NEXT_OPEN",
                          "target_pct": BASE_TARGET_PCT,
                          "reason": "MC57_LT_20",
                      }
                  return {
                      "status": "OK",
                      "action": "HOLD_80",
                      "target_pct": PANIC_TARGET_PCT,
                      "reason": "PANIC_ACTIVE",
                  }
          
              if trigger is None:
                  return {
                      "status": "DATA_REQUIRED",
                      "action": None,
                      "target_pct": None,
                      "reason": "PANIC_TRIGGER_UNRESOLVED",
                  }
              if trigger:
                  return {
                      "status": "OK",
                      "action": "RAISE_TO_80_NEXT_OPEN",
                      "target_pct": PANIC_TARGET_PCT,
                      "reason": "SEED_RSI30_MC57_GE_20",
                  }
              return {
                  "status": "OK",
                  "action": "BASELINE_30",
                  "target_pct": BASE_TARGET_PCT,
                  "reason": "NO_PANIC_TRIGGER",
              }
          V38V7_4

          cat > tests/test_nqsar_input.py <<'V38V7_5'
          import json
          import pytest
          from v38.nqsar_input import NQSARInputError, normalize_nqsar_text
          
          SESSION="2026-09-08"; ASOF="2026-09-09T05:00:00+09:00"
          
          def test_full_authoritative_json_is_normalized():
              out=normalize_nqsar_text(json.dumps({"session_date":SESSION,"generated_at":"2026-09-08T16:00:00-04:00","source":"fixture","state":"Green"}),expected_session_date=SESSION,as_of=ASOF,source_name="nqsar.json")
              assert out["state"]=="Green" and out["input_kind"]=="state"
          
          def test_exp_state_id_json_is_normalized():
              out=normalize_nqsar_text(json.dumps({"session_date":SESSION,"generated_at":"2026-09-08T16:00:00-04:00","source":"nq.csv","exp_state_id":4}),expected_session_date=SESSION,as_of=ASOF,source_name="nqsar.json")
              assert out["state"]=="Green" and out["exp_state_id"]==4
          
          def test_raw_sar_state_text_is_normalized():
              out=normalize_nqsar_text("2026-09-08,Blue",expected_session_date=SESSION,as_of=ASOF,source_name="sar_state.txt")
              assert out["state"]=="Blue" and out["source"]=="sar_state.txt"
          
          def test_dated_alias_json_is_normalized():
              out=normalize_nqsar_text('{"asof":"2026-09-08","color":"red"}',expected_session_date=SESSION,as_of=ASOF,source_name="sar_state.txt")
              assert out["state"]=="Red"
          
