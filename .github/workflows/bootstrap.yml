name: Install V38 Diagnostics v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PAYLOAD_COMMIT: 29b781392549435f67a831a082e7bf538a0d9330

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate diagnostics payload
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import os
          import re
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          payload_commit = os.environ["PAYLOAD_COMMIT"]

          print(f"Reading payload from immutable commit: {payload_commit}")

          old_workflow = subprocess.run(
              [
                  "git",
                  "show",
                  f"{payload_commit}:.github/workflows/bootstrap.yml",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          marker = "          V38_DIAGNOSTICS_PAYLOAD_B64: |"

          if marker not in old_workflow:
              raise SystemExit("Payload marker not found")

          section = old_workflow.split(marker, 1)[1]

          payload_lines = []

          for line in section.splitlines()[1:]:
              if line.startswith("            "):
                  payload_lines.append(line.strip())
              else:
                  break

          if not payload_lines:
              raise SystemExit("Payload is empty")

          raw_payload = "".join(payload_lines)

          clean_payload = re.sub(
              r"[^A-Za-z0-9+/=]",
              "",
              raw_payload,
          )

          clean_payload = clean_payload.rstrip("=")
          clean_payload += "=" * (
              (4 - len(clean_payload) % 4) % 4
          )

          print(f"Raw payload chars: {len(raw_payload)}")
          print(f"Clean payload chars: {len(clean_payload)}")

          try:
              archive_bytes = base64.b64decode(
                  clean_payload,
                  validate=True,
              )
          except Exception as exc:
              raise SystemExit(
                  f"Base64 decoding failed: {exc}"
              ) from exc

          actual_sha = hashlib.sha256(
              archive_bytes
          ).hexdigest()

          print(f"Decoded archive SHA256: {actual_sha}")

          allowed_files = {
              "src/v38/nqsar_engine.py",
              "src/v38/mc57_engine.py",
              "src/v38/diagnostics.py",
              "src/v38/reference_gates.py",
              "scripts/calculate_diagnostics.py",
              "tests/test_nqsar_engine.py",
              "tests/test_mc57_engine.py",
              "tests/test_diagnostics.py",
              "tests/test_reference_gates.py",
              "docs/DIAGNOSTICS.md",
          }

          try:
              tf = tarfile.open(
                  fileobj=io.BytesIO(archive_bytes),
                  mode="r:gz",
              )
          except Exception as exc:
              raise SystemExit(
                  f"Decoded payload is not a valid tar.gz: {exc}"
              ) from exc

          with tf:
              members = tf.getmembers()

              actual_files = set()

              safe_members = []

              for member in members:
                  posix_path = PurePosixPath(member.name)

                  if posix_path.is_absolute():
                      raise SystemExit(
                          f"Absolute archive path forbidden: {member.name}"
                      )

                  if ".." in posix_path.parts:
                      raise SystemExit(
                          f"Parent traversal forbidden: {member.name}"
                      )

                  if member.issym() or member.islnk():
                      raise SystemExit(
                          f"Archive links forbidden: {member.name}"
                      )

                  normalized = str(posix_path)

                  if member.isfile():
                      actual_files.add(normalized)

                  safe_members.append(member)

              unexpected = actual_files - allowed_files
              missing = allowed_files - actual_files

              if unexpected:
                  raise SystemExit(
                      "Unexpected files in archive:\n"
                      + "\n".join(sorted(unexpected))
                  )

              if missing:
                  raise SystemExit(
                      "Missing required files in archive:\n"
                      + "\n".join(sorted(missing))
                  )

              print("Archive contents verified.")

              tf.extractall(
                  path=".",
                  members=safe_members,
              )

          for path in sorted(allowed_files):
              p = Path(path)

              if not p.is_file():
                  raise SystemExit(
                      f"Restored file missing: {path}"
                  )

              if p.stat().st_size == 0:
                  raise SystemExit(
                      f"Restored file is empty: {path}"
                  )

              print(
                  f"RESTORED {path} "
                  f"({p.stat().st_size} bytes)"
              )

          print("Diagnostics payload restored successfully.")
          PY

      - name: Guard production files
        shell: bash
        run: |
          set -euo pipefail

          FORBIDDEN=(
            data/rs.json
            data/breadth.json
            data/f123.json
            data/market_state.json
            data/core12.json
          )

          for path in "${FORBIDDEN[@]}"; do
            if ! git diff --quiet -- "$path"; then
              echo "::error::Production shard modified: $path"
              git diff -- "$path"
              exit 1
            fi
          done

          if ! git diff --quiet -- .github/workflows; then
            echo "::error::Workflow changed during payload restoration"
            git diff -- .github/workflows
            exit 1
          fi

          echo "Production guard passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -e . \
            pytest

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=src pytest -q

          COLLECT="$(
            PYTHONPATH=src pytest --collect-only -q
          )"

          printf '%s\n' "$COLLECT"

          COUNT="$(
            printf '%s\n' "$COLLECT" \
              | sed -nE \
                's/^([0-9]+) tests? collected.*$/\1/p' \
              | tail -1
          )"

          echo "Collected test count: ${COUNT:-UNKNOWN}"

          if [ "${COUNT:-}" != "73" ]; then
            echo "::error::Expected exactly 73 tests, got ${COUNT:-UNKNOWN}"
            exit 1
          fi

          python -m compileall -q src scripts

          echo "73 tests passed."
          echo "compileall passed."

      - name: Remove generated test files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            .pytest_cache \
            src/*.egg-info \
            *.egg-info

          find . \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          echo "Generated files cleaned."

      - name: Verify changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail

          ALLOWED=(
            src/v38/nqsar_engine.py
            src/v38/mc57_engine.py
            src/v38/diagnostics.py
            src/v38/reference_gates.py
            scripts/calculate_diagnostics.py
            tests/test_nqsar_engine.py
            tests/test_mc57_engine.py
            tests/test_diagnostics.py
            tests/test_reference_gates.py
            docs/DIAGNOSTICS.md
          )

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            allowed=0

            for candidate in "${ALLOWED[@]}"; do
              if [ "$path" = "$candidate" ]; then
                allowed=1
                break
              fi
            done

            if [ "$allowed" -ne 1 ]; then
              echo "::error::Unexpected changed file: $path"
              exit 1
            fi
          done <<< "$CHANGED"

          echo "Changed-file allowlist passed."

      - name: Commit diagnostics only
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            src/v38/nqsar_engine.py \
            src/v38/mc57_engine.py \
            src/v38/diagnostics.py \
            src/v38/reference_gates.py \
            scripts/calculate_diagnostics.py \
            tests/test_nqsar_engine.py \
            tests/test_mc57_engine.py \
            tests/test_diagnostics.py \
            tests/test_reference_gates.py \
            docs/DIAGNOSTICS.md

          STAGED="$(
            git diff \
              --cached \
              --name-only
          )"

          echo "Staged files:"
          printf '%s\n' "$STAGED"

          if printf '%s\n' "$STAGED" \
            | grep -q '^\.github/workflows/'
          then
            echo "::error::Workflow modification staged"
            exit 1
          fi

          if printf '%s\n' "$STAGED" \
            | grep -Eq \
              '^data/(rs|breadth|f123|market_state|core12)\.json$'
          then
            echo "::error::Production shard staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Diagnostics already installed."
            exit 0
          fi

          git commit \
            -m "Add isolated V38 NQSAR MC57 diagnostics and readiness gates"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Diagnostics successfully pushed to main."
              exit 0
            fi

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed"
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
