          cat > tests/test_reference_gates.py <<'V38FILE_8'
          from v38.reference_gates import (
              DATA_REQUIRED,
              READY,
              mc57_reference_gate,
              nqsar_reference_gate,
              overall_reference_status,
          )
          
          
