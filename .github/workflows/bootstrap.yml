name: Bootstrap V38 Market Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      SOURCE_COMMIT: 15e448e9c8a8642b568b3a781d2e96f890b93bad
      REPOSITORY: shkts1520-crypto/market-dashboard

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified V38 source files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILES=(
            "README.md"
            "TEST_REPORT.md"
            "pyproject.toml"
            "scripts/calculate_all.py"
            "scripts/calculate_f123.py"
            "scripts/calculate_market.py"
            "scripts/calculate_stocks.py"
            "src/v38/__init__.py"
            "src/v38/calculate_pipeline.py"
            "src/v38/f123_engine.py"
            "src/v38/market_engine.py"
            "src/v38/stock_adapter.py"
            "tests/test_calculate_pipeline.py"
            "tests/test_f123_engine.py"
            "tests/test_market_engine.py"
            "tests/test_stock_adapter.py"
          )

          for path in "${FILES[@]}"; do
            echo "Restoring: $path"
            mkdir -p "$(dirname "$path")"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/contents/${path}?ref=${SOURCE_COMMIT}" \
              --output "${path}"
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -e . \
            pytest

          pytest -q

          python -m compileall -q src scripts

      - name: Confirm workflow files are untouched
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .github/workflows; then
            echo "::error::Workflow file modification detected."
            git diff -- .github/workflows
            exit 1
          fi

          echo "Workflow files unchanged."

      - name: Prepare clean commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf scripts/__pycache__
          rm -rf src/v38/__pycache__
          rm -rf tests/__pycache__
          rm -rf src/*.egg-info

          git rm -f data/bootstrap-status.txt 2>/dev/null || true

          git add \
            README.md \
            TEST_REPORT.md \
            pyproject.toml \
            scripts/calculate_all.py \
            scripts/calculate_f123.py \
            scripts/calculate_market.py \
            scripts/calculate_stocks.py \
            src/v38/__init__.py \
            src/v38/calculate_pipeline.py \
            src/v38/f123_engine.py \
            src/v38/market_engine.py \
            src/v38/stock_adapter.py \
            tests/test_calculate_pipeline.py \
            tests/test_f123_engine.py \
            tests/test_market_engine.py \
            tests/test_stock_adapter.py

          echo "Files staged:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap verified V38 market dashboard implementation"

      - name: Push to main
        shell: bash
        run: |
          set -euo pipefail

          if git diff HEAD~1 --name-only 2>/dev/null | grep -q '^\.github/workflows/'; then
            echo "::error::Refusing to push workflow-file modifications."
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"

            if git push origin HEAD:main; then
              echo "V38 implementation successfully pushed to main."
              exit 0
            fi

            echo "Push failed. Refreshing origin/main..."
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed."
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts."
          exit 1
