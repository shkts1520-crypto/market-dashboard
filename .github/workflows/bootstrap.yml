              assert "FIXED_57_ETF_UNIVERSE" in gate.missing
          
          
          def test_overall_reference_status_requires_all_ready():
              nq = nqsar_reference_gate({"verified": True, "fsm_version": "v1", "golden_fixture_sha256": "a"})
              mc = mc57_reference_gate({"verified": True, "etf_universe": [f"E{i}" for i in range(57)], "golden_fixture_sha256": "b"})
              assert overall_reference_status(nq, mc) == READY
              assert overall_reference_status(nq, mc57_reference_gate(None)) == DATA_REQUIRED
          V38FILE_8
          cat > docs/DIAGNOSTICS.md <<'V38FILE_9'
          # V38 NQSAR / MC57 Diagnostics
          
          This package is intentionally isolated from the production trading path.
          
          ## Implemented from the 2026-09-10 master specification
          
          - MC57 mathematical contract:
            - fixed 57-ETF design contract; the actual ticker set is **not guessed**
            - 12 equal-weight participation metrics
            - binary metrics: True=100 / False=0; missing observations excluded
            - DD52 continuous score: `clip((DD52 + 0.30) / 0.25 * 100, 0, 100)`
            - Raw = equal-weight mean of all 12 metric scores
            - EMA2: `span=2, adjust=False`
            - calibration: immediately preceding 3780 sessions, current day excluded, `ddof=0`
            - `MC57 = 100 / (1 + 3**(-Z))`
          - NQSAR known contract metadata:
            - NQ, PSAR(step=.02, increment=.02, max=.08), EMA21, Wilder RSI14
            - Blue / Green / Yellow / Red
            - completed bars only
          - Explicit readiness gates.
          
          ## Intentionally DATA_REQUIRED
          
          The following are never inferred:
          
          1. NQSAR exact FSM / `_onimine_state` transition logic and golden fixture.
          2. MC57 exact fixed 57-ETF ticker universe, replacement policy, and golden fixture.
          
          Until those references are frozen, diagnostics return `DATA_REQUIRED` and never publish a fabricated NQSAR state or MC57 value.
          
          ## CLI
          
          ```bash
          PYTHONPATH=src python scripts/calculate_diagnostics.py \
            --session-date 2026-09-08 \
            --generated-at 2026-09-10T19:00:00+09:00 \
            --reference-dir reference \
            --output-dir data
          ```
          
          Optional reference files:
          
          - `reference/nqsar_reference.json`
          - `reference/mc57_reference.json`
          
          Use `--require-ready` when CI should fail until both authoritative reference packages are present.
          
          This module does not alter Normal Stock, TQQQ, Panic Reset, F1/F2/F3, ranking, positions, or any production shard.
          V38FILE_9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Validate recovered suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src pytest -q
          COUNT="$(PYTHONPATH=src pytest --collect-only -q | sed -nE 's/^([0-9]+) tests? collected.*$/\1/p' | tail -1)"
          echo "Collected tests: ${COUNT:-UNKNOWN}"
          test "${COUNT:-}" = "73"
          python -m compileall -q src scripts

      - name: Guard changed files
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED_RE="^(src/v38/(nqsar_engine|mc57_engine|diagnostics|reference_gates)\.py|scripts/calculate_diagnostics\.py|tests/test_(nqsar_engine|mc57_engine|diagnostics|reference_gates)\.py|docs/DIAGNOSTICS\.md)$"
          CHANGED="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          printf '%s\n' "$CHANGED"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! printf '%s\n' "$path" | grep -Eq "$ALLOWED_RE"; then
              echo "::error::Unexpected changed file: $path"
              exit 1
            fi
          done <<< "$CHANGED"

      - name: Commit diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache src/*.egg-info *.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/v38/nqsar_engine.py src/v38/mc57_engine.py src/v38/diagnostics.py src/v38/reference_gates.py scripts/calculate_diagnostics.py tests/test_nqsar_engine.py tests/test_mc57_engine.py tests/test_diagnostics.py tests/test_reference_gates.py docs/DIAGNOSTICS.md
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "Diagnostics already current."
            exit 0
          fi
          git commit -m "Add isolated V38 NQSAR MC57 diagnostics and readiness gates"
          git push origin HEAD:main
