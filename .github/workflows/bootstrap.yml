name: Install V38 UI Preflight v8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Verify v7 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f src/v38/nqsar_input.py
          test -f src/v38/positions_engine.py
          test -f src/v38/panic_reset_engine.py
          test -f src/v38/tqqq_engine.py
          PYTHONPATH=src pytest -q
          BASE_COUNT="$(PYTHONPATH=src pytest -o addopts='' --collect-only -q | grep -c '::')"
          echo "Baseline tests: $BASE_COUNT"
          if [ "$BASE_COUNT" != "126" ]; then
            echo "::error::Expected v7 baseline of exactly 126 tests, got $BASE_COUNT"
            exit 1
          fi

      - name: Write v8 UI preflight files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/v38 scripts assets tests docs

          cat > src/v38/freshness.py <<'V38V8_0'
          from __future__ import annotations

          import json
          import math
          import os
          import tempfile
          from datetime import date
          from pathlib import Path
          from typing import Any, Iterable

          CALCULATION_VERSION = "v38-freshness-1.0.0"
          SCHEMA_VERSION = "v38.freshness.1"

          READY = "READY"
          STALE = "STALE"
          DATA_REQUIRED = "DATA_REQUIRED"

          DEFAULT_UI_SHARDS = (
              "market_state.json",
              "breadth.json",
              "mc57.json",
              "f123.json",
              "core12.json",
              "positions.json",
              "rotation.json",
              "rs.json",
              "weekly.json",
              "options/index.json",
          )

          REQUIRED_META = (
              "session_date",
              "generated_at",
              "coverage",
              "source",
              "schema_version",
              "calculation_version",
          )


          class FreshnessError(RuntimeError):
              """Raised when the freshness contract itself is invalid."""


          def _date(value: Any, field: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise FreshnessError(f"{field} is required")
              text = value.strip()
              try:
                  parsed = date.fromisoformat(text)
              except ValueError as exc:
                  raise FreshnessError(f"{field} must be YYYY-MM-DD") from exc
              if parsed.isoformat() != text:
                  raise FreshnessError(f"{field} must be YYYY-MM-DD")
              return text


          def _finite_or_none(value: Any) -> float | None:
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  x = float(value)
                  return x if math.isfinite(x) else None
              return None


          def assess_shard_object(
              obj: Any,
              *,
              name: str,
              target_session: str,
          ) -> dict[str, Any]:
              target = _date(target_session, "target_session")

              if not isinstance(obj, dict):
                  return {
                      "name": name,
                      "status": DATA_REQUIRED,
                      "reason": "EXPECTED_JSON_OBJECT",
                      "session_date": None,
                      "coverage": None,
                  }

              missing = [
                  key
                  for key in REQUIRED_META
                  if key not in obj
              ]

              if missing:
                  return {
                      "name": name,
                      "status": DATA_REQUIRED,
                      "reason": "MISSING_METADATA",
                      "missing": missing,
                      "session_date": obj.get("session_date"),
                      "coverage": _finite_or_none(
                          obj.get("coverage")
                      ),
                  }

              session = obj.get("session_date")

              try:
                  session = _date(
                      session,
                      f"{name}.session_date",
                  )
              except FreshnessError:
                  return {
                      "name": name,
                      "status": DATA_REQUIRED,
                      "reason": "INVALID_SESSION_DATE",
                      "session_date": session,
                      "coverage": _finite_or_none(
                          obj.get("coverage")
                      ),
                  }

              base = {
                  "name": name,
                  "session_date": session,
                  "generated_at": obj.get("generated_at"),
                  "coverage": _finite_or_none(
                      obj.get("coverage")
                  ),
                  "source": obj.get("source"),
                  "schema_version": obj.get(
                      "schema_version"
                  ),
                  "calculation_version": obj.get(
                      "calculation_version"
                  ),
              }

              if session != target:
                  return {
                      **base,
                      "status": STALE,
                      "reason": "SESSION_MISMATCH",
                      "target_session": target,
                  }

              for key in (
                  "generated_at",
                  "source",
                  "schema_version",
                  "calculation_version",
              ):
                  if (
                      not isinstance(obj.get(key), str)
                      or not obj[key].strip()
                  ):
                      return {
                          **base,
                          "status": DATA_REQUIRED,
                          "reason": (
                              f"INVALID_{key.upper()}"
                          ),
                      }

              return {
                  **base,
                  "status": READY,
                  "reason": "CURRENT_SESSION",
              }


          def assess_shard_file(
              path: str | Path,
              *,
              name: str | None = None,
              target_session: str,
          ) -> dict[str, Any]:
              p = Path(path)
              label = name or p.as_posix()

              if not p.exists():
                  return {
                      "name": label,
                      "status": DATA_REQUIRED,
                      "reason": "FILE_MISSING",
                      "session_date": None,
                      "coverage": None,
                  }

              try:
                  obj = json.loads(
                      p.read_text(
                          encoding="utf-8"
                      )
                  )
              except (
                  OSError,
                  UnicodeDecodeError,
                  json.JSONDecodeError,
              ):
                  return {
                      "name": label,
                      "status": DATA_REQUIRED,
                      "reason": "INVALID_JSON",
                      "session_date": None,
                      "coverage": None,
                  }

              return assess_shard_object(
                  obj,
                  name=label,
                  target_session=target_session,
              )


          def build_freshness(
              data_dir: str | Path,
              *,
              target_session: str,
              generated_at: str,
              shard_names: Iterable[str] = DEFAULT_UI_SHARDS,
          ) -> dict[str, Any]:
              target = _date(
                  target_session,
                  "target_session",
              )

              if (
                  not isinstance(generated_at, str)
                  or not generated_at.strip()
              ):
                  raise FreshnessError(
                      "generated_at is required"
                  )

              root = Path(data_dir)
              names = tuple(
                  str(x)
                  for x in shard_names
              )

              if not names:
                  raise FreshnessError(
                      "at least one shard is required"
                  )

              if len(set(names)) != len(names):
                  raise FreshnessError(
                      "duplicate shard names are not allowed"
                  )

              shards = [
                  assess_shard_file(
                      root / name,
                      name=name,
                      target_session=target,
                  )
                  for name in names
              ]

              statuses = [
                  row["status"]
                  for row in shards
              ]

              if STALE in statuses:
                  overall = STALE
              elif DATA_REQUIRED in statuses:
                  overall = DATA_REQUIRED
              else:
                  overall = READY

              return {
                  "session_date": target,
                  "generated_at": generated_at,
                  "coverage": (
                      sum(
                          1
                          for row in shards
                          if row["status"] == READY
                      )
                      / len(shards)
                  ),
                  "source": "derived:shard-freshness",
                  "schema_version": SCHEMA_VERSION,
                  "calculation_version": CALCULATION_VERSION,
                  "status": overall,
                  "ready_count": sum(
                      1
                      for row in shards
                      if row["status"] == READY
                  ),
                  "stale_count": sum(
                      1
                      for row in shards
                      if row["status"] == STALE
                  ),
                  "data_required_count": sum(
                      1
                      for row in shards
                      if row["status"] == DATA_REQUIRED
                  ),
                  "shards": shards,
              }


          def atomic_write_json(
              path: str | Path,
              obj: dict[str, Any],
          ) -> Path:
              p = Path(path)

              p.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              text = (
                  json.dumps(
                      obj,
                      ensure_ascii=False,
                      sort_keys=True,
                      indent=2,
                      allow_nan=False,
                  )
                  + "\n"
              )

              fd, tmp = tempfile.mkstemp(
                  prefix=p.name + ".",
                  dir=p.parent,
              )

              try:
                  with os.fdopen(
                      fd,
                      "w",
                      encoding="utf-8",
                  ) as f:
                      f.write(text)

                  os.replace(
                      tmp,
                      p,
                  )
              finally:
                  if os.path.exists(tmp):
                      os.unlink(tmp)

              return p
          V38V8_0

          cat > src/v38/ui_contract.py <<'V38V8_1'
          from __future__ import annotations

          import re
          from html.parser import HTMLParser
          from typing import Any

          EXPECTED_TABS = (
              ("Daily", "#t-market"),
              ("Positions", "#t-alloc"),
              ("Core 12", "#t-port"),
              ("Rotation", "#t-rotation"),
              ("RS", "#t-rs"),
              ("Weekly", "#t-weekly"),
              ("Options", "#t-options"),
              ("Publish", "#t-post1"),
              ("Rules", "#t-rules"),
          )

          FORBIDDEN_TABS = {
              "Setups",
              "Movers",
          }

          REQUIRED_VISUAL_TOKENS = (
              ".card",
              ".chart",
              ".rsx-card",
              ".rsx-item",
              ".mrow",
              ".bflags",
          )

          PRODUCTION_FORBIDDEN_PATTERNS = (
              r"Entry\s*\*\s*0\.75",
              r"entry\s*\*\s*0\.75",
              r"SOXL",
              r"TQQQ\s*/\s*SOXL",
              r"隔週リバランス",
              r"21EMA.*Exit",
              r"10SMA.*Exit",
              r"ATR2",
              r"建値Stop",
          )


          class UIContractError(RuntimeError):
              pass


          class _NavParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.in_nav = 0
                  self.capture_anchor = False
                  self.anchor_href: str | None = None
                  self.anchor_text: list[str] = []
                  self.tabs: list[
                      tuple[str, str | None]
                  ] = []
                  self.section_ids: set[str] = set()

              def handle_starttag(
                  self,
                  tag: str,
                  attrs: list[
                      tuple[str, str | None]
                  ],
              ) -> None:
                  amap = dict(attrs)

                  if tag == "nav":
                      self.in_nav += 1

                  elif (
                      tag == "section"
                      and amap.get("id")
                  ):
                      self.section_ids.add(
                          str(amap["id"])
                      )

                  elif (
                      tag == "a"
                      and self.in_nav
                  ):
                      classes = set(
                          (
                              amap.get("class")
                              or ""
                          ).split()
                      )

                      if "tabx" in classes:
                          self.capture_anchor = True
                          self.anchor_href = (
                              amap.get("href")
                          )
                          self.anchor_text = []

              def handle_data(
                  self,
                  data: str,
              ) -> None:
                  if self.capture_anchor:
                      self.anchor_text.append(data)

              def handle_endtag(
                  self,
                  tag: str,
              ) -> None:
                  if (
                      tag == "a"
                      and self.capture_anchor
                  ):
                      label = " ".join(
                          "".join(
                              self.anchor_text
                          ).split()
                      )

                      self.tabs.append(
                          (
                              label,
                              self.anchor_href,
                          )
                      )

                      self.capture_anchor = False
                      self.anchor_href = None
                      self.anchor_text = []

                  elif (
                      tag == "nav"
                      and self.in_nav
                  ):
                      self.in_nav -= 1


          def inspect_shell(
              html: str,
          ) -> dict[str, Any]:
              if (
                  not isinstance(html, str)
                  or not html.strip()
              ):
                  raise UIContractError(
                      "HTML is empty"
                  )

              parser = _NavParser()
              parser.feed(html)

              expected = list(
                  EXPECTED_TABS
              )

              missing_visual = [
                  token
                  for token in REQUIRED_VISUAL_TOKENS
                  if token not in html
              ]

              missing_sections = [
                  href[1:]
                  for _, href in EXPECTED_TABS
                  if href[1:]
                  not in parser.section_ids
              ]

              forbidden_present = [
                  label
                  for label, _ in parser.tabs
                  if label in FORBIDDEN_TABS
              ]

              return {
                  "tabs": parser.tabs,
                  "tabs_exact": (
                      parser.tabs == expected
                  ),
                  "forbidden_tabs": (
                      forbidden_present
                  ),
                  "missing_sections": (
                      missing_sections
                  ),
                  "missing_visual_tokens": (
                      missing_visual
                  ),
              }


          def validate_canonical_shell(
              html: str,
          ) -> dict[str, Any]:
              report = inspect_shell(html)
              problems: list[str] = []

              if not report["tabs_exact"]:
                  problems.append(
                      "tabs must equal "
                      f"{list(EXPECTED_TABS)!r}; "
                      f"got {report['tabs']!r}"
                  )

              if report["forbidden_tabs"]:
                  problems.append(
                      "forbidden tabs present: "
                      f"{report['forbidden_tabs']}"
                  )

              if report["missing_sections"]:
                  problems.append(
                      "missing tab sections: "
                      f"{report['missing_sections']}"
                  )

              if report[
                  "missing_visual_tokens"
              ]:
                  problems.append(
                      "missing v5 visual tokens: "
                      f"{report['missing_visual_tokens']}"
                  )

              if problems:
                  raise UIContractError(
                      "; ".join(problems)
                  )

              return report


          def scan_production_forbidden_logic(
              html: str,
          ) -> list[str]:
              hits: list[str] = []

              for pattern in (
                  PRODUCTION_FORBIDDEN_PATTERNS
              ):
                  if re.search(
                      pattern,
                      html,
                      flags=re.I | re.S,
                  ):
                      hits.append(pattern)

              return hits


          def validate_production_html(
              html: str,
          ) -> dict[str, Any]:
              report = validate_canonical_shell(
                  html
              )

              hits = (
                  scan_production_forbidden_logic(
                      html
                  )
              )

              if hits:
                  raise UIContractError(
                      "legacy/forbidden production "
                      f"logic found: {hits}"
                  )

              return report


          def display_value(
              value: Any,
              *,
              decimals: int | None = None,
          ) -> str:
              if (
                  value is None
                  or value == ""
              ):
                  return "—"

              if isinstance(value, bool):
                  return (
                      "true"
                      if value
                      else "false"
                  )

              if isinstance(value, float):
                  if (
                      value != value
                      or value
                      in (
                          float("inf"),
                          float("-inf"),
                      )
                  ):
                      return "—"

              if (
                  isinstance(
                      value,
                      (int, float),
                  )
                  and decimals is not None
              ):
                  return (
                      f"{float(value):."
                      f"{decimals}f}"
                  )

              return str(value)
          V38V8_1

          cat > scripts/preflight_ui.py <<'V38V8_2'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path

          from v38.freshness import (
              atomic_write_json,
              build_freshness,
          )
          from v38.ui_contract import (
              UIContractError,
              validate_canonical_shell,
          )


          def main() -> int:
              p = argparse.ArgumentParser(
                  description=(
                      "Validate V38 canonical UI shell "
                      "and shard freshness before "
                      "renderer work"
                  )
              )

              p.add_argument(
                  "--canonical",
                  default=(
                      "V38_Command_Center_mock_v5.html"
                  ),
              )

              p.add_argument(
                  "--data-dir",
                  default="data",
              )

              p.add_argument(
                  "--session-date",
                  required=True,
              )

              p.add_argument(
                  "--generated-at",
                  required=True,
              )

              p.add_argument(
                  "--freshness-output"
              )

              p.add_argument(
                  "--require-all-ready",
                  action="store_true",
              )

              a = p.parse_args()

              canonical = Path(
                  a.canonical
              )

              if not canonical.exists():
                  print(
                      json.dumps(
                          {
                              "status": (
                                  "DATA_REQUIRED"
                              ),
                              "reason": (
                                  "CANONICAL_V5_MISSING"
                              ),
                              "path": str(
                                  canonical
                              ),
                          },
                          sort_keys=True,
                      )
                  )

                  return 3

              try:
                  shell = (
                      validate_canonical_shell(
                          canonical.read_text(
                              encoding="utf-8"
                          )
                      )
                  )

              except (
                  OSError,
                  UnicodeDecodeError,
                  UIContractError,
              ) as exc:
                  print(
                      json.dumps(
                          {
                              "status": "FAILED",
                              "reason": (
                                  "CANONICAL_V5_INVALID"
                              ),
                              "detail": str(exc),
                          },
                          ensure_ascii=False,
                          sort_keys=True,
                      )
                  )

                  return 4

              freshness = build_freshness(
                  a.data_dir,
                  target_session=(
                      a.session_date
                  ),
                  generated_at=(
                      a.generated_at
                  ),
              )

              if a.freshness_output:
                  atomic_write_json(
                      a.freshness_output,
                      freshness,
                  )

              result = {
                  "status": freshness[
                      "status"
                  ],
                  "canonical": "OK",
                  "tabs": [
                      label
                      for label, _
                      in shell["tabs"]
                  ],
                  "freshness": freshness,
              }

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      sort_keys=True,
                      allow_nan=False,
                  )
              )

              if (
                  a.require_all_ready
                  and freshness["status"]
                  != "READY"
              ):
                  return 2

              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          V38V8_2

          cat > assets/v38-runtime.js <<'V38V8_3'
          (function (global) {
            'use strict';

            const REQUIRED_META = [
              'session_date',
              'generated_at',
              'coverage',
              'source',
              'schema_version',
              'calculation_version'
            ];

            function missing(value) {
              return value === null ||
                value === undefined ||
                value === '' ||
                (
                  typeof value === 'number' &&
                  !Number.isFinite(value)
                );
            }

            function display(
              value,
              decimals
            ) {
              if (missing(value)) {
                return '—';
              }

              if (
                typeof value === 'number' &&
                Number.isInteger(decimals)
              ) {
                return value.toFixed(
                  decimals
                );
              }

              return String(value);
            }

            function assessShard(
              obj,
              targetSession
            ) {
              if (
                !obj ||
                typeof obj !== 'object' ||
                Array.isArray(obj)
              ) {
                return {
                  status: 'DATA_REQUIRED',
                  reason: 'EXPECTED_JSON_OBJECT'
                };
              }

              const absent =
                REQUIRED_META.filter(
                  (key) => !(key in obj)
                );

              if (absent.length) {
                return {
                  status: 'DATA_REQUIRED',
                  reason: 'MISSING_METADATA',
                  missing: absent
                };
              }

              if (
                obj.session_date !==
                targetSession
              ) {
                return {
                  status: 'STALE',
                  reason: 'SESSION_MISMATCH',
                  session_date:
                    obj.session_date
                };
              }

              return {
                status: 'READY',
                reason: 'CURRENT_SESSION'
              };
            }

            async function loadJson(path) {
              const response =
                await fetch(
                  path,
                  {
                    cache: 'no-store'
                  }
                );

              if (!response.ok) {
                throw new Error(
                  'HTTP ' +
                  response.status +
                  ' for ' +
                  path
                );
              }

              return response.json();
            }

            global.V38Runtime =
              Object.freeze(
                {
                  missing,
                  display,
                  assessShard,
                  loadJson
                }
              );
          })(window);
          V38V8_3

          cat > tests/test_freshness.py <<'V38V8_4'
          import json

          import pytest

          from v38.freshness import (
              DATA_REQUIRED,
              READY,
              STALE,
              FreshnessError,
              assess_shard_file,
              assess_shard_object,
              atomic_write_json,
              build_freshness,
          )

          SESSION = "2026-09-08"
          GENERATED = (
              "2026-09-09T05:00:00+09:00"
          )


          def shard(
              session=SESSION,
              **updates,
          ):
              x = {
                  "session_date": session,
                  "generated_at": GENERATED,
                  "coverage": 1.0,
                  "source": "fixture",
                  "schema_version": "x",
                  "calculation_version": "x",
              }

              x.update(updates)

              return x


          def test_current_shard_is_ready():
              out = assess_shard_object(
                  shard(),
                  name="rs.json",
                  target_session=SESSION,
              )

              assert (
                  out["status"]
                  == READY
              )


          def test_session_mismatch_is_stale_not_success():
              out = assess_shard_object(
                  shard("2026-09-07"),
                  name="rs.json",
                  target_session=SESSION,
              )

              assert (
                  out["status"]
                  == STALE
              )

              assert (
                  out["reason"]
                  == "SESSION_MISMATCH"
              )


          def test_missing_metadata_is_data_required():
              obj = shard()
              obj.pop("source")

              out = assess_shard_object(
                  obj,
                  name="rs.json",
                  target_session=SESSION,
              )

              assert (
                  out["status"]
                  == DATA_REQUIRED
              )

              assert (
                  "source"
                  in out["missing"]
              )


          def test_missing_file_is_data_required(
              tmp_path,
          ):
              out = assess_shard_file(
                  tmp_path
                  / "missing.json",
                  name="missing.json",
                  target_session=SESSION,
              )

              assert (
                  out["status"]
                  == DATA_REQUIRED
              )

              assert (
                  out["reason"]
                  == "FILE_MISSING"
              )


          def test_invalid_json_is_data_required(
              tmp_path,
          ):
              p = tmp_path / "bad.json"

              p.write_text(
                  "{bad",
                  encoding="utf-8",
              )

              out = assess_shard_file(
                  p,
                  name="bad.json",
                  target_session=SESSION,
              )

              assert (
                  out["status"]
                  == DATA_REQUIRED
              )

              assert (
                  out["reason"]
                  == "INVALID_JSON"
              )


          def test_stale_dominates_overall_status(
              tmp_path,
          ):
              (
                  tmp_path
                  / "a.json"
              ).write_text(
                  json.dumps(
                      shard(
                          "2026-09-07"
                      )
                  ),
                  encoding="utf-8",
              )

              out = build_freshness(
                  tmp_path,
                  target_session=SESSION,
                  generated_at=GENERATED,
                  shard_names=(
                      "a.json",
                      "missing.json",
                  ),
              )

              assert (
                  out["status"]
                  == STALE
              )

              assert (
                  out["stale_count"]
                  == 1
              )

              assert (
                  out[
                      "data_required_count"
                  ]
                  == 1
