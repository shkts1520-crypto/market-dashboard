      - name: Guard changed files
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -type d \
            -name __pycache__ \
            -prune \
            -exec rm -rf {} +

          rm -rf \
            .pytest_cache \
            src/*.egg-info \
            *.egg-info

          EXPECTED="$(
            printf '%s\n' \
              src/v38/freshness.py \
              src/v38/ui_contract.py \
              scripts/preflight_ui.py \
              assets/v38-runtime.js \
              tests/test_freshness.py \
              tests/test_ui_contract.py \
              tests/test_ui_preflight.py \
              docs/UI_PREFLIGHT.md \
            | sort
          )"

          CHANGED="$(
            {
              git diff --name-only
              git ls-files \
                --others \
                --exclude-standard
            } | sort -u
          )"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [
            "$CHANGED" != "$EXPECTED"
          ]; then
            echo "::error::v8 changed-file set does not match exact allowlist"

            diff -u \
              <(
                printf '%s\n' \
                  "$EXPECTED"
              ) \
              <(
                printf '%s\n' \
                  "$CHANGED"
              ) \
              || true

            exit 1
          fi

          echo "v8 changed-file guard passed."

      - name: Commit v8 only
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            src/v38/freshness.py \
            src/v38/ui_contract.py \
            scripts/preflight_ui.py \
            assets/v38-runtime.js \
            tests/test_freshness.py \
            tests/test_ui_contract.py \
            tests/test_ui_preflight.py \
            docs/UI_PREFLIGHT.md

          STAGED="$(
            git diff \
              --cached \
              --name-only \
            | sort
          )"

          EXPECTED="$(
            printf '%s\n' \
              src/v38/freshness.py \
              src/v38/ui_contract.py \
              scripts/preflight_ui.py \
              assets/v38-runtime.js \
              tests/test_freshness.py \
              tests/test_ui_contract.py \
              tests/test_ui_preflight.py \
              docs/UI_PREFLIGHT.md \
            | sort
          )"

          if [
            "$STAGED" != "$EXPECTED"
          ]; then
            echo "::error::Unexpected staged file set"
            exit 1
          fi

          git commit \
