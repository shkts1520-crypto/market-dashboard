name: Install V38 Diagnostics v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PAYLOAD_COMMIT: 29b781392549435f67a831a082e7bf538a0d9330
      EXPECTED_SHA256: f7a28caed4d99957c288d8714b46d9ed4dd1f331a9f0d390fdf3a378677169a0

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore diagnostics payload safely
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import os
          import re
          import subprocess
          import tarfile
          from pathlib import Path

          payload_commit = os.environ["PAYLOAD_COMMIT"]
          expected_sha = os.environ["EXPECTED_SHA256"]

          print(f"Reading diagnostics payload from commit: {payload_commit}")

          old_workflow = subprocess.run(
              [
                  "git",
                  "show",
                  f"{payload_commit}:.github/workflows/bootstrap.yml",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          marker = "          V38_DIAGNOSTICS_PAYLOAD_B64: |"

          if marker not in old_workflow:
              raise SystemExit(
                  "V38_DIAGNOSTICS_PAYLOAD_B64 marker not found "
                  f"in commit {payload_commit}"
              )

          payload_section = old_workflow.split(marker, 1)[1]

          payload_lines = []

          for line in payload_section.splitlines()[1:]:
              if line.startswith("            "):
                  payload_lines.append(line.strip())
                  continue
              break

          if not payload_lines:
              raise SystemExit("Diagnostics payload is empty")

          raw_payload = "".join(payload_lines)

          print(f"Raw payload characters: {len(raw_payload)}")

          # Remove anything outside the Base64 alphabet.
          # This specifically protects against invisible/copied garbage.
          clean_payload = re.sub(
              r"[^A-Za-z0-9+/=]",
              "",
              raw_payload,
          )

          # Normalize padding.
          clean_payload = clean_payload.rstrip("=")
          clean_payload += "=" * ((4 - len(clean_payload) % 4) % 4)

          print(f"Sanitized payload characters: {len(clean_payload)}")
          print(f"Base64 length mod 4: {len(clean_payload) % 4}")

          try:
              archive_bytes = base64.b64decode(
                  clean_payload,
                  validate=True,
              )
          except Exception as exc:
              raise SystemExit(
                  f"Base64 decode failed after sanitization: {exc}"
              ) from exc

          actual_sha = hashlib.sha256(archive_bytes).hexdigest()

          print(f"Decoded archive SHA256: {actual_sha}")

          if actual_sha != expected_sha:
              raise SystemExit(
                  "Diagnostics archive SHA256 mismatch.\n"
                  f"expected: {expected_sha}\n"
                  f"actual:   {actual_sha}"
              )

          print("SHA256 verified.")

          allowed_files = {
              "src/v38/nqsar_engine.py",
              "src/v38/mc57_engine.py",
              "src/v38/diagnostics.py",
              "src/v38/reference_gates.py",
              "scripts/calculate_diagnostics.py",
              "tests/test_nqsar_engine.py",
              "tests/test_mc57_engine.py",
              "tests/test_diagnostics.py",
              "tests/test_reference_gates.py",
              "docs/DIAGNOSTICS.md",
          }

          archive = io.BytesIO(archive_bytes)

          with tarfile.open(
              fileobj=archive,
              mode="r:gz",
          ) as tf:
              members = tf.getmembers()

              archive_files = set()

              for member in members:
                  normalized = member.name.lstrip("./")
                  path = Path(normalized)

                  if (
                      member.name.startswith("/")
                      or ".." in path.parts
                  ):
                      raise SystemExit(
                          f"Unsafe archive path: {member.name}"
                      )

                  if member.issym() or member.islnk():
                      raise SystemExit(
                          f"Archive links are forbidden: {member.name}"
                      )

                  if member.isfile():
                      archive_files.add(normalized)

              unexpected = archive_files - allowed_files
              missing = allowed_files - archive_files

              if unexpected:
                  raise SystemExit(
                      "Unexpected files in diagnostics archive: "
                      + ", ".join(sorted(unexpected))
                  )

              if missing:
                  raise SystemExit(
                      "Missing files in diagnostics archive: "
                      + ", ".join(sorted(missing))
                  )

              tf.extractall(".")

          print("Diagnostics payload restored successfully.")

          for path in sorted(allowed_files):
              if not Path(path).is_file():
                  raise SystemExit(
                      f"Expected restored file missing: {path}"
                  )
              print(f"RESTORED: {path}")
          PY

      - name: Guard production and workflow files
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .github/workflows; then
            echo "::error::Workflow files were modified by diagnostics payload"
            git diff -- .github/workflows
            exit 1
          fi

          FORBIDDEN=(
            data/rs.json
            data/breadth.json
            data/f123.json
            data/market_state.json
            data/core12.json
          )

          for path in "${FORBIDDEN[@]}"; do
            if ! git diff --quiet -- "$path"; then
              echo "::error::Production shard modified: $path"
              git diff -- "$path"
              exit 1
            fi
          done

          echo "Production/workflow guard passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -e . \
            pytest

      - name: Validate full recovered suite
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=src pytest -q

          COUNT="$(
            PYTHONPATH=src \
            pytest --collect-only -q \
            | tail -1 \
            | awk '{print $1}'
          )"

          echo "Collected tests: $COUNT"

          if [ "$COUNT" != "73" ]; then
            echo "::error::Expected 73 tests, collected $COUNT"
            exit 1
          fi

          python -m compileall -q src scripts

          echo "73-test validation passed."
          echo "compileall passed."

      - name: Verify diagnostics files only
        shell: bash
        run: |
          set -euo pipefail

          ALLOWED=(
            src/v38/nqsar_engine.py
            src/v38/mc57_engine.py
            src/v38/diagnostics.py
            src/v38/reference_gates.py
            scripts/calculate_diagnostics.py
            tests/test_nqsar_engine.py
            tests/test_mc57_engine.py
            tests/test_diagnostics.py
            tests/test_reference_gates.py
            docs/DIAGNOSTICS.md
          )

          git status --short

          CHANGED="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            allowed=0

            for candidate in "${ALLOWED[@]}"; do
              if [ "$path" = "$candidate" ]; then
                allowed=1
                break
              fi
            done

            if [ "$allowed" -ne 1 ]; then
              echo "::error::Unexpected changed file: $path"
              exit 1
            fi
          done <<< "$CHANGED"

          echo "Changed-file allowlist passed."

      - name: Commit diagnostics only
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf \
            scripts/__pycache__ \
            src/v38/__pycache__ \
            tests/__pycache__ \
            src/*.egg-info

          git add -- \
            src/v38/nqsar_engine.py \
            src/v38/mc57_engine.py \
            src/v38/diagnostics.py \
            src/v38/reference_gates.py \
            scripts/calculate_diagnostics.py \
            tests/test_nqsar_engine.py \
            tests/test_mc57_engine.py \
            tests/test_diagnostics.py \
            tests/test_reference_gates.py \
            docs/DIAGNOSTICS.md

          STAGED="$(
            git diff \
              --cached \
              --name-only
          )"

          echo "Staged files:"
          printf '%s\n' "$STAGED"

          if printf '%s\n' "$STAGED" \
            | grep -q '^\.github/workflows/'
          then
            echo "::error::Workflow modification staged"
            exit 1
          fi

          if printf '%s\n' "$STAGED" \
            | grep -Eq '^data/(rs|breadth|f123|market_state|core12)\.json$'
          then
            echo "::error::Production shard modification staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Diagnostics v3 already installed; no changes to commit."
            exit 0
          fi

          git commit \
            -m "Add isolated V38 NQSAR MC57 diagnostics and readiness gates"

          for attempt in 1 2 3; do
            echo "Push attempt: $attempt"

            if git push origin HEAD:main; then
              echo "V38 diagnostics v3 pushed to main."
              exit 0
            fi

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed"
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1
