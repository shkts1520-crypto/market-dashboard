name: Source Fidelity One Shot

on:
  push:
    branches:
      - fix/source-visual-fidelity-v2-20260916

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[source-patch]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-visual-fidelity-v2-20260916
          fetch-depth: 1
      - name: Apply source fidelity patch
        run: |
          set -euo pipefail
          python scripts/_apply_source_fidelity_patch.py
          node --check assets/v38-canonical-binder.js
          git diff --check
      - name: Commit binder
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/v38-canonical-binder.js; then
            echo 'Binder already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v38-canonical-binder.js
          git commit -m 'Bind current data into source visual structures [source-patch]'
          git push origin HEAD:fix/source-visual-fidelity-v2-20260916
