name: ATLQ Live Provider Diagnostic

on:
  push:
    branches:
      - diagnostic/atlq-live-provider-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check 'yfinance==0.2.66'
      - name: Probe ATLQ providers from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          import yfinance as yf

          TARGET = '2026-09-11'

          def safe(v):
              if v is None:
                  return None
              s = str(v)
              return s[:500]

          def yahoo(symbol):
              out = {'provider': 'yahoo', 'symbol': symbol}
              try:
                  frame = yf.Ticker(symbol).history(period='2y', interval='1d', auto_adjust=True, actions=False)
                  out['rows'] = int(len(frame))
                  if len(frame):
                      out['first'] = str(frame.index[0])
                      out['last'] = str(frame.index[-1])
                      exact = frame.loc[frame.index.strftime('%Y-%m-%d') == TARGET]
                      out['exact_rows'] = int(len(exact))
                      if len(exact):
                          row = exact.iloc[-1]
                          out['exact'] = {k: float(row[k]) for k in ('Open','High','Low','Close','Volume') if k in row}
              except Exception as exc:
                  out['error'] = f'{type(exc).__name__}: {exc}'
              print(json.dumps(out, sort_keys=True, default=str))

          def nasdaq(symbol):
              query = urllib.parse.urlencode({'assetclass':'stocks','fromdate':TARGET,'todate':TARGET,'limit':'10'})
              url = f'https://api.nasdaq.com/api/quote/{urllib.parse.quote(symbol, safe="")}/historical?{query}'
              headers = {
                  'Accept': 'application/json, text/plain, */*',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Cache-Control': 'no-cache',
                  'Origin': 'https://www.nasdaq.com',
                  'Pragma': 'no-cache',
                  'Referer': f'https://www.nasdaq.com/market-activity/stocks/{symbol.lower()}/historical',
                  'Sec-Fetch-Dest': 'empty',
                  'Sec-Fetch-Mode': 'cors',
                  'Sec-Fetch-Site': 'same-site',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              }
              out = {'provider':'nasdaq','symbol':symbol,'url':url}
              try:
                  req = urllib.request.Request(url, method='GET', headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      out['http_status'] = int(response.status)
                      out['content_type'] = response.headers.get('content-type')
                      out['body_prefix'] = body[:300]
                      obj = json.loads(body)
                  out['api_status'] = obj.get('status') if isinstance(obj, dict) else None
                  data = obj.get('data') if isinstance(obj, dict) else None
                  out['data_type'] = type(data).__name__
                  if isinstance(data, dict):
                      out['totalRecords'] = data.get('totalRecords')
                      table = data.get('tradesTable')
                      rows = table.get('rows') if isinstance(table, dict) else None
                      out['row_count'] = len(rows) if isinstance(rows, list) else None
                      out['dates'] = [safe(r.get('date')) for r in (rows or [])[:10] if isinstance(r, dict)]
                      out['first_row'] = (rows or [None])[0]
              except urllib.error.HTTPError as exc:
                  out['error'] = f'HTTPError {exc.code}: {exc.reason}'
                  try:
                      out['error_body'] = exc.read().decode('utf-8', errors='replace')[:500]
                  except Exception:
                      pass
              except Exception as exc:
                  out['error'] = f'{type(exc).__name__}: {exc}'
              print(json.dumps(out, sort_keys=True, default=str))

          def tradingview(symbol):
              url = 'https://scanner.tradingview.com/america/scan'
              payload = {
                  'filter': [],
                  'options': {'lang': 'en'},
                  'symbols': {'query': {'types': []}, 'tickers': [f'NASDAQ:{symbol}']},
                  'columns': ['open','high','low','close','volume'],
                  'range': [0,1],
              }
              out = {'provider':'tradingview','symbol':symbol}
              try:
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload, separators=(',',':')).encode(),
                      method='POST',
                      headers={
                          'Content-Type':'application/json',
                          'Accept':'application/json',
                          'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
                      },
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      out['http_status'] = int(response.status)
                      out['body_prefix'] = body[:500]
                      obj = json.loads(body)
                  out['totalCount'] = obj.get('totalCount') if isinstance(obj, dict) else None
                  out['data'] = obj.get('data') if isinstance(obj, dict) else None
              except urllib.error.HTTPError as exc:
                  out['error'] = f'HTTPError {exc.code}: {exc.reason}'
                  try:
                      out['error_body'] = exc.read().decode('utf-8', errors='replace')[:500]
                  except Exception:
                      pass
              except Exception as exc:
                  out['error'] = f'{type(exc).__name__}: {exc}'
              print(json.dumps(out, sort_keys=True, default=str))

          yahoo('ATLQ')
          yahoo('JAB')
          nasdaq('ATLQ')
          nasdaq('JAB')
          tradingview('ATLQ')
          tradingview('JAB')
          PY
