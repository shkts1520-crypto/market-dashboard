name: One-off fix rotation money flow

on:
  push:
    branches:
      - fix/complete-31-card-bindings

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-31-card-bindings
          fetch-depth: 1

      - name: Repair misplaced money-flow producer body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/v38/ui_view_model.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _rotation_money_flow(')
          end = text.index('def build_ui_view_model(', start)

          replacement = '''def _rotation_money_flow(market_series: dict[str, list[dict[str, Any]]]) -> dict[str, Any]:
              """Display-only RRG coordinates from completed daily bars.

              Canonical definition: GICS11 + five style ETFs, horizontal relative strength
              versus SPY with 100 neutral, vertical 10-session momentum of that relative
              strength with 100 neutral. This is diagnostic display data, never a trading gate.
              """
              labels = {
                  "XLB": "素材", "XLC": "通信", "XLE": "エネルギー", "XLF": "金融",
                  "XLI": "資本財", "XLK": "テクノロジー", "XLP": "生活必需品",
                  "XLRE": "不動産", "XLU": "公益", "XLV": "ヘルスケア", "XLY": "一般消費財",
                  "IWD": "バリュー", "IWF": "グロース", "IWM": "小型株",
                  "MDY": "中型株", "RSP": "S&P等加重",
              }
              spy = market_series.get("SPY") or []
              spy_by_date = {
                  str(row.get("date")): _finite(row.get("close"))
                  for row in spy if isinstance(row, dict)
              }
              rows: list[dict[str, Any]] = []
              for ticker, label in labels.items():
                  rel: list[tuple[str, float]] = []
                  for row in market_series.get(ticker) or []:
                      if not isinstance(row, dict):
                          continue
                      date = str(row.get("date") or "")
                      close = _finite(row.get("close"))
                      benchmark = spy_by_date.get(date)
                      if date and close is not None and benchmark is not None and benchmark > 0:
                          rel.append((date, close / benchmark))
                  if len(rel) < 64:
                      continue
                  current = rel[-1][1]
                  base63 = rel[-64][1]
                  base10 = rel[-11][1]
                  if base63 <= 0 or base10 <= 0:
                      continue
                  rows.append({
                      "ticker": ticker,
                      "label": label,
                      "x": 100.0 * current / base63,
                      "y": 100.0 * current / base10,
                      "date": rel[-1][0],
                      "source": "completed daily close / SPY; 63-session RS and 10-session RS momentum",
                  })
              return {
                  "status": READY if len(rows) == len(labels) else DATA_REQUIRED,
                  "reason": "CURRENT_MARKET_SERIES" if len(rows) == len(labels) else "STYLE_OR_SECTOR_SERIES_INCOMPLETE",
                  "rows": rows,
                  "expected_count": len(labels),
                  "definition": "x=100*(relative strength now / 63 sessions ago); y=100*(relative strength now / 10 sessions ago)",
                  "trading_gate_eligible": False,
              }


          def _ratio_observation(
              market_series: dict[str, list[dict[str, Any]]], left: str, right: str
          ) -> dict[str, Any]:
              right_by_date = {
                  str(row.get("date")): _finite(row.get("close"))
                  for row in market_series.get(right, []) if isinstance(row, dict)
              }
              rows = []
              for row in market_series.get(left, []):
                  if not isinstance(row, dict):
                      continue
                  date = str(row.get("date") or "")
                  lhs, rhs = _finite(row.get("close")), right_by_date.get(date)
                  if date and lhs is not None and rhs is not None and rhs != 0:
                      rows.append({"date": date, "value": lhs / rhs})
              return {
                  "status": READY if len(rows) >= 2 else DATA_REQUIRED,
                  "rows": rows,
                  "current": rows[-1]["value"] if rows else None,
                  "source": f"market_inputs.json completed daily close: {left}/{right}",
              }


          def _distribution_observation(rows: list[dict[str, Any]]) -> int | None:
              sample = rows[-26:]
              if len(sample) < 2:
                  return None
              count = 0
              for previous, current in zip(sample, sample[1:]):
                  pc, cc = _finite(previous.get("close")), _finite(current.get("close"))
                  pv, cv = _finite(previous.get("volume")), _finite(current.get("volume"))
                  if None not in (pc, cc, pv, cv) and cc < pc and cv > pv:
                      count += 1
              return count


          '''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY

          python -m py_compile src/v38/ui_view_model.py
          git diff --check

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/v38/ui_view_model.py; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v38/ui_view_model.py
          git commit -m "Fix rotation money flow producer placement"
          git push origin HEAD:fix/complete-31-card-bindings
