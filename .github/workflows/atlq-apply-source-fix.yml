name: Apply ATLQ Source Fix

on:
  push:
    branches:
      - diagnostic/atlq-live-provider-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/atlq-live-provider-20260913
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact observed-row validation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/v38/stock_gap_repair.py')
          text = path.read_text(encoding='utf-8')
          original = text

          marker = '''def _nasdaq_historical_current_bar(*, ticker: str, target_session: str) -> dict[str, Any] | None:\n'''
          helper = '''def _valid_observed_row(row: Any) -> bool:\n    if not isinstance(row, dict):\n        return False\n    try:\n        open_, high, low, close, volume = [\n            float(row.get(key))\n            for key in ("open", "high", "low", "close", "volume")\n        ]\n    except (TypeError, ValueError):\n        return False\n    if not all(pd.notna(value) for value in (open_, high, low, close, volume)):\n        return False\n    return close > 0 and high >= low and volume >= 0\n\n\n'''
          if helper not in text:
              assert marker in text, 'helper insertion marker not found'
              text = text.replace(marker, helper + marker, 1)

          old_query = '''    query = urllib.parse.urlencode(\n        {\n            "assetclass": "stocks",\n            "fromdate": target_session,\n            "todate": target_session,\n            "limit": "10",\n        }\n    )\n'''
          new_query = '''    try:\n        target = pd.Timestamp(target_session)\n    except Exception:\n        return None\n    query = urllib.parse.urlencode(\n        {\n            "assetclass": "stocks",\n            "fromdate": (target - pd.Timedelta(days=1)).strftime("%Y-%m-%d"),\n            "todate": (target + pd.Timedelta(days=1)).strftime("%Y-%m-%d"),\n            "limit": "10",\n        }\n    )\n'''
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          else:
              assert new_query in text, 'Nasdaq query block not found'

          old_fallbacks = '''    if target_session not in by_date:\n        current = _nasdaq_historical_current_bar(\n            ticker=ticker,\n            target_session=target_session,\n        )\n        if current is not None:\n            by_date[target_session] = current\n\n    if target_session not in by_date:\n        current = _tradingview_current_bar(\n            ticker=ticker,\n            exchange=exchange,\n            target_session=target_session,\n        )\n        if current is not None:\n            by_date[target_session] = current\n\n    if target_session not in by_date:\n        # Some data vendors keep the old symbol as an alias after a same-CUSIP\n        # rename. Accept it only when the provider returns the exact target date;\n        # never roll a pre-change or stale bar forward.\n        legacy_current = next(\n            (\n                row for row in prior_rows\n                if str(row.get("date") or "") == target_session\n                and row.get("close") is not None\n            ),\n            None,\n        )\n        if legacy_current is not None:\n            by_date[target_session] = legacy_current\n'''
          new_fallbacks = '''    if not _valid_observed_row(by_date.get(target_session)):\n        by_date.pop(target_session, None)\n        current = _nasdaq_historical_current_bar(\n            ticker=ticker,\n            target_session=target_session,\n        )\n        if current is not None:\n            by_date[target_session] = current\n\n    if not _valid_observed_row(by_date.get(target_session)):\n        by_date.pop(target_session, None)\n        current = _tradingview_current_bar(\n            ticker=ticker,\n            exchange=exchange,\n            target_session=target_session,\n        )\n        if current is not None:\n            by_date[target_session] = current\n\n    if not _valid_observed_row(by_date.get(target_session)):\n        by_date.pop(target_session, None)\n        # Some data vendors keep the old symbol as an alias after a same-CUSIP\n        # rename. Accept it only when the provider returns the exact target date;\n        # never roll a pre-change or stale bar forward.\n        legacy_current = next(\n            (\n                row for row in prior_rows\n                if str(row.get("date") or "") == target_session\n                and _valid_observed_row(row)\n            ),\n            None,\n        )\n        if legacy_current is not None:\n            by_date[target_session] = legacy_current\n'''
          if old_fallbacks in text:
              text = text.replace(old_fallbacks, new_fallbacks, 1)
          else:
              assert new_fallbacks in text, 'fallback block not found'

          old_isolated = '''    if any(row.get("date") == target_session and row.get("close") is not None for row in rows):\n        return rows\n\n    alias_rows = _corporate_action_rows(\n        yf,\n        ticker=ticker,\n        target_session=target_session,\n    )\n    return alias_rows if any(\n        row.get("date") == target_session and row.get("close") is not None\n        for row in alias_rows\n    ) else []\n'''
          new_isolated = '''    if any(\n        row.get("date") == target_session and _valid_observed_row(row)\n        for row in rows\n    ):\n        return rows\n\n    alias_rows = _corporate_action_rows(\n        yf,\n        ticker=ticker,\n        target_session=target_session,\n    )\n    return alias_rows if any(\n        row.get("date") == target_session and _valid_observed_row(row)\n        for row in alias_rows\n    ) else []\n'''
          if old_isolated in text:
              text = text.replace(old_isolated, new_isolated, 1)
          else:
              assert new_isolated in text, 'isolated-history block not found'

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('patched stock_gap_repair.py')
          else:
              print('source already patched')
          PY
      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest 'yfinance==0.2.66'
          PYTHONPATH=src pytest -q tests/test_stock_gap_repair_alias.py tests/test_stock_gap_repair_nan_fallback.py
      - name: Commit source fix if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/v38/stock_gap_repair.py; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v38/stock_gap_repair.py
          git commit -m 'Fix ATLQ NaN row blocking exact live fallbacks'
          git push origin HEAD:diagnostic/atlq-live-provider-20260913
