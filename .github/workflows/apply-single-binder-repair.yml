name: Apply Single Binder Repair

on:
  push:
    branches:
      - fix/single-canonical-binder-20260916
    paths:
      - scripts/apply_single_binder_repair.py
      - assets/v38-canonical-binder.js
      - .github/workflows/apply-single-binder-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-canonical-binder-20260916
          fetch-depth: 0
      - name: Apply architecture repair
        run: python scripts/apply_single_binder_repair.py
      - name: Validate syntax
        run: |
          python -m compileall -q src scripts
          node --check assets/v38-canonical-binder.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v38/live_acquisition.py src/v38/ui_view_model.py scripts/build_site.py
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Replace layered UI patches with single canonical binder [skip ci]'
            git push origin HEAD:fix/single-canonical-binder-20260916
          fi
